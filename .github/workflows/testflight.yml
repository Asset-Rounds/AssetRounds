name: Owner TestFlight upload

on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact owner-reviewed main SHA to archive and upload
        required: true
        type: string
      confirm_upload:
        description: Confirm one signing, export, and TestFlight upload attempt
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: owner-testflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Validate, sign, and upload once
    runs-on: macos-26
    timeout-minutes: 90
    environment: app-store-connect
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PROJECT_PATH: FieldEvidenceApp.xcodeproj
      SCHEME: FieldEvidenceApp
      CONFIGURATION: Release
      RELEASE_HOME: ${{ runner.temp }}/asset-rounds-release-home
      CERTIFICATE_PATH: ${{ runner.temp }}/asset-rounds-distribution.p12
      KEYCHAIN_PATH: ${{ runner.temp }}/asset-rounds-release.keychain-db
      EXPORT_OPTIONS_PATH: ${{ runner.temp }}/TestFlightExportOptions.plist
      ARCHIVE_PATH: ${{ runner.temp }}/AssetRounds.xcarchive
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ inputs.reviewed_main_sha }}

      - name: Validate release authority
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          test "$CONFIRM_UPLOAD" = "true"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$REVIEWED_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_MAIN_SHA"
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test "$remote_main_sha" = "$REVIEWED_MAIN_SHA"
          bash Scripts/release-preflight.sh --release-ready "$REVIEWED_MAIN_SHA"

      - name: Require environment credentials
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
          do
            test -n "${!name:-}"
          done

      - name: Prepare ephemeral signing authority
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_directory="$RELEASE_HOME/.private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"
          mkdir -p "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_P8_BASE64" | /usr/bin/base64 -D > "$key_path"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          test -s "$key_path"
          test -s "$CERTIFICATE_PATH"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          cp Release/TestFlightExportOptions.plist "$EXPORT_OPTIONS_PATH"
          team_id="$(jq -er '.values.appleDeveloperTeamID' Release/ProvidedReleaseValuesV1.json)"
          /usr/libexec/PlistBuddy -c "Add :teamID string $team_id" "$EXPORT_OPTIONS_PATH"
          printf '::add-mask::%s\n' "$keychain_password"
          {
            printf 'AUTHENTICATION_KEY_PATH=%s\n' "$key_path"
            printf 'KEYCHAIN_PASSWORD=%s\n' "$keychain_password"
          } >> "$GITHUB_ENV"

      - name: Archive exactly once
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          release_version="$(jq -er '.values.releaseMarketingVersion' Release/ProvidedReleaseValuesV1.json)"
          release_build="$(jq -er '.values.releaseBuildNumber' Release/ProvidedReleaseValuesV1.json)"
          team_id="$(jq -er '.values.appleDeveloperTeamID' Release/ProvidedReleaseValuesV1.json)"
          test ! -e "$ARCHIVE_PATH"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTHENTICATION_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$team_id" \
            MARKETING_VERSION="$release_version" \
            CURRENT_PROJECT_VERSION="$release_build" \
            archive
          test -d "$ARCHIVE_PATH"

      - name: Export exactly once
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          export_path="$RUNNER_TEMP/AssetRounds-export"
          test ! -e "$export_path"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTHENTICATION_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          ipa_paths=("$export_path"/*.ipa)
          test "${#ipa_paths[@]}" -eq 1
          test -f "${ipa_paths[0]}"
          test -s "${ipa_paths[0]}"
          printf 'IPA_PATH=%s\n' "${ipa_paths[0]}" >> "$GITHUB_ENV"

      - name: Upload to TestFlight exactly once
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          HOME="$RELEASE_HOME" xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            > "$RUNNER_TEMP/altool-upload.log" 2>&1

      - name: Create sanitized evidence
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          evidence_directory="$RUNNER_TEMP/testflight-evidence"
          mkdir -p "$evidence_directory"
          bundle_id="$(plutil -extract ApplicationProperties.CFBundleIdentifier raw -o - "$ARCHIVE_PATH/Info.plist")"
          release_version="$(plutil -extract ApplicationProperties.CFBundleShortVersionString raw -o - "$ARCHIVE_PATH/Info.plist")"
          release_build="$(plutil -extract ApplicationProperties.CFBundleVersion raw -o - "$ARCHIVE_PATH/Info.plist")"
          ipa_sha256="$(shasum -a 256 "$IPA_PATH" | awk '{ print $1 }')"
          jq -n \
            --arg bundleID "$bundle_id" \
            --arg build "$release_build" \
            --arg ipaSHA256 "$ipa_sha256" \
            --arg reviewedMainSHA "$REVIEWED_MAIN_SHA" \
            --arg version "$release_version" \
            '{
              bundleID: $bundleID,
              build: $build,
              ipaSHA256: $ipaSHA256,
              reviewedMainSHA: $reviewedMainSHA,
              schemaVersion: 1,
              uploadAttemptCount: 1,
              uploadResult: "submitted",
              version: $version
            }' > "$evidence_directory/TestFlightUploadEvidenceV1.json"
          plutil -lint "$ARCHIVE_PATH/Info.plist"
          shasum -a 256 "$evidence_directory/TestFlightUploadEvidenceV1.json" \
            > "$evidence_directory/SHA256SUMS.txt"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-${{ inputs.reviewed_main_sha }}
          path: ${{ runner.temp }}/testflight-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral signing authority
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set +e
          if [ -e "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [ -f "$CERTIFICATE_PATH" ]; then
            /bin/rm -f "$CERTIFICATE_PATH"
          fi
          if [ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]; then
            /bin/rm -f "$RELEASE_HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            /bin/rmdir "$RELEASE_HOME/.private_keys" 2>/dev/null
            /bin/rmdir "$RELEASE_HOME" 2>/dev/null
          fi
          if [ -f "$EXPORT_OPTIONS_PATH" ]; then
            /bin/rm -f "$EXPORT_OPTIONS_PATH"
          fi
