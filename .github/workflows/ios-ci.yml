name: iOS CI

on:
  workflow_dispatch:
    inputs:
      run_ui_smoke:
        description: Run the task-authorized XCUITest smoke after build and unit tests
        required: true
        default: false
        type: boolean
      s10_4_shard_id:
        description: Exact S10.4 shard ID from Scripts/s10-4-shards.json; all other cards use none
        required: true
        default: none
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}-${{ inputs.s10_4_shard_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPECTED_XCODE_VERSION: "Xcode 26.6"
      EXPECTED_XCODE_BUILD: "Build version 17F113"
      EXPECTED_MINIMUM_IOS: "18.0"
      PROJECT_PATH: FieldEvidenceApp.xcodeproj
      SCHEME: FieldEvidenceApp
      CONFIGURATION: Debug
      SIMULATOR_RUNTIME: iOS 26.2
      SIMULATOR_NAME: iPhone 17
      CI_SIMULATOR_BOOT_TIMEOUT_SECONDS: "900"
      CODE_SIGNING_ALLOWED: "NO"
      NSUnbufferedIO: "YES"

    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          CI_BUDGET_START_EPOCH="$(date +%s)"
          CI_ARTIFACT_DIR="$RUNNER_TEMP/FieldEvidenceCI"
          mkdir -p "$CI_ARTIFACT_DIR"
          printf 'CI_BUDGET_START_EPOCH=%s\nCI_ARTIFACT_DIR=%s\n' \
            "$CI_BUDGET_START_EPOCH" "$CI_ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate task selection and timeout tier
        shell: bash
        env:
          DISPATCH_RUN_UI_SMOKE: ${{ inputs.run_ui_smoke }}
          DISPATCH_S10_4_SHARD_ID: ${{ inputs.s10_4_shard_id }}
        run: |
          set -euo pipefail
          test -f Scripts/ci-selection.json
          test -f Scripts/run-with-timeout.sh
          test -f Scripts/build-smoke.sh
          test -f Scripts/test-smoke.sh
          test -f Scripts/ui-smoke.sh

          jq -e '
            def exact_keys:
              ([
                "schemaVersion",
                "taskID",
                "tier",
                "runUISmoke",
                "setupArtifactTimeoutSeconds",
                "buildTimeoutSeconds",
                "testTimeoutSeconds",
                "uiTimeoutSeconds",
                "totalBudgetSeconds",
                "unitTestSelectors",
                "uiTestSelectors"
              ] | sort) == (keys | sort);
            def nonempty_string:
              type == "string" and test("\\S");
            def selectors($prefix; $minimum):
              . as $values
              | ($values | type == "array")
                and (($values | length) >= $minimum)
                and (all($values[];
                  type == "string"
                  and startswith($prefix)
                  and (length > ($prefix | length))))
                and (($values | unique | length) == ($values | length));
            def tier_values_match:
              if .tier == "N8" then
                [
                  .setupArtifactTimeoutSeconds,
                  .buildTimeoutSeconds,
                  .testTimeoutSeconds,
                  .uiTimeoutSeconds,
                  .totalBudgetSeconds
                ] == [300, 600, 900, 0, 2400]
              elif .tier == "P12" then
                [
                  .setupArtifactTimeoutSeconds,
                  .buildTimeoutSeconds,
                  .testTimeoutSeconds,
                  .uiTimeoutSeconds,
                  .totalBudgetSeconds
                ] == [300, 600, 900, 900, 3300]
              elif .tier == "F25" then
                [
                  .setupArtifactTimeoutSeconds,
                  .buildTimeoutSeconds,
                  .testTimeoutSeconds,
                  .uiTimeoutSeconds,
                  .totalBudgetSeconds
                ] == [300, 900, 1200, 1800, 4500]
              else false
              end;
            exact_keys
            and (.schemaVersion == 1)
            and (.taskID | nonempty_string)
            and (.tier | type == "string" and IN("N8", "P12", "F25"))
            and (.runUISmoke | type == "boolean")
            and tier_values_match
            and (.unitTestSelectors | selectors("FieldEvidenceAppTests/"; 1))
            and (
              if .tier == "N8" then
                (.runUISmoke == false)
                and (.uiTestSelectors | type == "array" and length == 0)
              else
                (.runUISmoke == true)
                and (.uiTestSelectors | selectors("FieldEvidenceAppUITests/"; 1) and length == 1)
              end
            )
          ' Scripts/ci-selection.json > /dev/null

          selection_run_ui="$(jq -r '.runUISmoke | tostring' Scripts/ci-selection.json)"
          test "$DISPATCH_RUN_UI_SMOKE" = "$selection_run_ui"

          CI_TASK_ID="$(jq -r '.taskID' Scripts/ci-selection.json)"
          CI_TIER="$(jq -r '.tier' Scripts/ci-selection.json)"
          CI_RUN_UI_SMOKE="$selection_run_ui"
          CI_SETUP_ARTIFACT_TIMEOUT_SECONDS="$(jq -r '.setupArtifactTimeoutSeconds' Scripts/ci-selection.json)"
          CI_BUILD_TIMEOUT_SECONDS="$(jq -r '.buildTimeoutSeconds' Scripts/ci-selection.json)"
          CI_TEST_TIMEOUT_SECONDS="$(jq -r '.testTimeoutSeconds' Scripts/ci-selection.json)"
          CI_UI_TIMEOUT_SECONDS="$(jq -r '.uiTimeoutSeconds' Scripts/ci-selection.json)"
          CI_TOTAL_BUDGET_SECONDS="$(jq -r '.totalBudgetSeconds' Scripts/ci-selection.json)"

          CI_S10_4_SHARD_ID="none"
          CI_ARTIFACT_SUFFIX=""
          if test "$CI_TASK_ID" = "S10.4"; then
            test "$DISPATCH_S10_4_SHARD_ID" != "none"
            test -f Scripts/s10-4-shards.json
            jq -e '
              def exact_keys($expected):
                ($expected | sort) == (keys | sort);
              def nonempty_string:
                type == "string" and test("\\S");
              def exact_environment_keys:
                exact_keys([
                  "appearance",
                  "contrast",
                  "contentSizeCategory",
                  "locale",
                  "layoutDirection",
                  "differentiateWithoutColor",
                  "reduceMotion",
                  "reduceTransparency"
                ]);
              [
                "voiceover",
                "voice_control",
                "larger_text",
                "dark_interface",
                "differentiate_without_color",
                "sufficient_contrast",
                "reduced_motion"
              ] as $features
              | [
                  "default_light",
                  "default_dark",
                  "increased_contrast",
                  "ax_text",
                  "differentiate_without_color",
                  "reduce_motion",
                  "reduce_transparency",
                  "minimum_os",
                  "double_length",
                  "rtl",
                  "rtl_string",
                  "tall",
                  "accented",
                  "bounded"
                ] as $requirements
              | [
                  "s10.4.current.default-light",
                  "s10.4.current.default-dark",
                  "s10.4.current.increased-contrast",
                  "s10.4.current.ax-text",
                  "s10.4.current.differentiate-without-color",
                  "s10.4.current.reduce-motion",
                  "s10.4.current.reduce-transparency",
                  "s10.4.minimum.minimum-os",
                  "s10.4.minimum.double-length",
                  "s10.4.minimum.rtl",
                  "s10.4.minimum.rtl-string",
                  "s10.4.minimum.tall",
                  "s10.4.minimum.accented",
                  "s10.4.minimum.bounded"
                ] as $shardIDs
              | exact_keys([
                  "schemaVersion",
                  "taskID",
                  "expectedStateCount",
                  "expectedVisualCellCount",
                  "expectedAccessibilityRowCount",
                  "commonTaskCount",
                  "deviceProfiles",
                  "shards"
                ])
                and (.schemaVersion == 1)
                and (.taskID == "S10.4")
                and (.expectedStateCount == 67)
                and (.expectedVisualCellCount == 938)
                and (.expectedAccessibilityRowCount == 84)
                and (.commonTaskCount == 6)
                and (.deviceProfiles == [
                  {
                    deviceProfileID: "iphone-17-ios-26.2-current",
                    simulatorRuntime: "iOS 26.2",
                    simulatorRuntimeBuild: "23C54",
                    simulatorName: "iPhone 17",
                    provisionRuntime: false,
                    runtimeDownloadVersion: ""
                  },
                  {
                    deviceProfileID: "iphone-se-3-ios-18.0-minimum",
                    simulatorRuntime: "iOS 18.0",
                    simulatorRuntimeBuild: "22A3351",
                    simulatorName: "iPhone SE (3rd generation)",
                    provisionRuntime: true,
                    runtimeDownloadVersion: "18.0"
                  }
                ])
                and (.shards | type == "array" and length == 14)
                and ([.shards[].shardID] == $shardIDs)
                and ([.shards[].requirementID] == $requirements)
                and ([.shards[].ordinal] == [range(1; 15)])
                and ([.shards[].shardID] | unique | length == 14)
                and all(.shards[];
                  exact_keys([
                    "ordinal",
                    "shardID",
                    "requirementID",
                    "deviceProfileID",
                    "accessibilityFeatures",
                    "environment"
                  ])
                  and (.ordinal | type == "number" and floor == .)
                  and (.shardID | type == "string" and test("^s10\\.4\\.(current|minimum)\\.[a-z0-9-]+$"))
                  and (.requirementID | nonempty_string)
                  and (.deviceProfileID | IN(
                    "iphone-17-ios-26.2-current",
                    "iphone-se-3-ios-18.0-minimum"
                  ))
                  and (.accessibilityFeatures | type == "array" and length == 1)
                  and ((.accessibilityFeatures | unique | length) == (.accessibilityFeatures | length))
                  and all(.accessibilityFeatures[]; IN($features[]))
                  and (.environment | exact_environment_keys)
                  and (.environment.appearance | IN("light", "dark"))
                  and (.environment.contrast | IN("standard", "increased"))
                  and (.environment.contentSizeCategory | IN(
                    "UICTContentSizeCategoryL",
                    "UICTContentSizeCategoryAccessibilityXXXL"
                  ))
                  and (.environment.locale | IN(
                    "en-US-release",
                    "en-US-double-length",
                    "ar-RTL",
                    "ar-RTL-string",
                    "en-US-tall",
                    "en-US-accented",
                    "en-US-bounded"
                  ))
                  and (.environment.layoutDirection | IN("left_to_right", "right_to_left"))
                  and (.environment.differentiateWithoutColor | type == "boolean")
                  and (.environment.reduceMotion | type == "boolean")
                  and (.environment.reduceTransparency | type == "boolean")
                )
                and ([
                  .shards[]
                  | {
                      shardID,
                      deviceProfileID,
                      accessibilityFeature: .accessibilityFeatures[0]
                    }
                ] == [
                  {shardID: "s10.4.current.default-light", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "voiceover"},
                  {shardID: "s10.4.current.default-dark", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "dark_interface"},
                  {shardID: "s10.4.current.increased-contrast", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "sufficient_contrast"},
                  {shardID: "s10.4.current.ax-text", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "larger_text"},
                  {shardID: "s10.4.current.differentiate-without-color", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "differentiate_without_color"},
                  {shardID: "s10.4.current.reduce-motion", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "reduced_motion"},
                  {shardID: "s10.4.current.reduce-transparency", deviceProfileID: "iphone-17-ios-26.2-current", accessibilityFeature: "voice_control"},
                  {shardID: "s10.4.minimum.minimum-os", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "voiceover"},
                  {shardID: "s10.4.minimum.double-length", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "larger_text"},
                  {shardID: "s10.4.minimum.rtl", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "dark_interface"},
                  {shardID: "s10.4.minimum.rtl-string", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "voice_control"},
                  {shardID: "s10.4.minimum.tall", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "reduced_motion"},
                  {shardID: "s10.4.minimum.accented", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "sufficient_contrast"},
                  {shardID: "s10.4.minimum.bounded", deviceProfileID: "iphone-se-3-ios-18.0-minimum", accessibilityFeature: "differentiate_without_color"}
                ])
                and ([
                  .shards[]
                  | select(.deviceProfileID == "iphone-17-ios-26.2-current")
                  | .accessibilityFeatures[]
                ] | sort) == ($features | sort)
                and ([
                  .shards[]
                  | select(.deviceProfileID == "iphone-se-3-ios-18.0-minimum")
                  | .accessibilityFeatures[]
                ] | sort) == ($features | sort)
                and (([.shards[].accessibilityFeatures | length] | add) * .commonTaskCount
                  == .expectedAccessibilityRowCount)
                and (.expectedStateCount * (.shards | length) == .expectedVisualCellCount)
                and (.shards[] | select(.requirementID == "default_dark")
                  | .environment.appearance == "dark")
                and (.shards[] | select(.requirementID == "increased_contrast")
                  | .environment.contrast == "increased")
                and (.shards[] | select(.requirementID == "ax_text")
                  | .environment.contentSizeCategory == "UICTContentSizeCategoryAccessibilityXXXL")
                and (.shards[] | select(.requirementID == "double_length")
                  | .environment.contentSizeCategory == "UICTContentSizeCategoryAccessibilityXXXL")
                and (.shards[] | select(.requirementID == "rtl")
                  | .environment.appearance == "dark")
                and (.shards[] | select(.requirementID == "tall")
                  | .environment.reduceMotion == true)
                and (.shards[] | select(.requirementID == "accented")
                  | .environment.contrast == "increased")
                and (.shards[] | select(.requirementID == "bounded")
                  | .environment.differentiateWithoutColor == true)
                and (.shards[] | select(.requirementID == "differentiate_without_color")
                  | .environment.differentiateWithoutColor == true)
                and (.shards[] | select(.requirementID == "reduce_motion")
                  | .environment.reduceMotion == true)
                and (.shards[] | select(.requirementID == "reduce_transparency")
                  | .environment.reduceTransparency == true)
            ' Scripts/s10-4-shards.json > /dev/null

            shard_count="$(jq -r --arg shard "$DISPATCH_S10_4_SHARD_ID" \
              '[.shards[] | select(.shardID == $shard)] | length' Scripts/s10-4-shards.json)"
            test "$shard_count" -eq 1
            shard_json="$(jq -cer --arg shard "$DISPATCH_S10_4_SHARD_ID" \
              '.shards[] | select(.shardID == $shard)' Scripts/s10-4-shards.json)"
            device_profile_id="$(jq -r '.deviceProfileID' <<< "$shard_json")"
            profile_json="$(jq -cer --arg profile "$device_profile_id" \
              '.deviceProfiles[] | select(.deviceProfileID == $profile)' Scripts/s10-4-shards.json)"

            CI_S10_4_SHARD_ID="$DISPATCH_S10_4_SHARD_ID"
            CI_ARTIFACT_SUFFIX="-$CI_S10_4_SHARD_ID"
            SIMULATOR_RUNTIME="$(jq -r '.simulatorRuntime' <<< "$profile_json")"
            SIMULATOR_RUNTIME_BUILD="$(jq -r '.simulatorRuntimeBuild' <<< "$profile_json")"
            SIMULATOR_NAME="$(jq -r '.simulatorName' <<< "$profile_json")"
            CI_S10_4_PROVISION_RUNTIME="$(jq -r '.provisionRuntime | tostring' <<< "$profile_json")"
            CI_S10_4_RUNTIME_DOWNLOAD_VERSION="$(jq -r '.runtimeDownloadVersion' <<< "$profile_json")"
            CI_S10_4_DEVICE_PROFILE_ID="$device_profile_id"
            CI_S10_4_SHARD_ORDINAL="$(jq -r '.ordinal' <<< "$shard_json")"
            CI_S10_4_REQUIREMENT_ID="$(jq -r '.requirementID' <<< "$shard_json")"
            CI_S10_4_ACCESSIBILITY_FEATURE="$(jq -er \
              '.accessibilityFeatures | if length == 1 then .[0] else error("expected one feature") end' \
              <<< "$shard_json")"
            CI_S10_4_ACCESSIBILITY_FEATURES="$(jq -r '.accessibilityFeatures | join(",")' <<< "$shard_json")"
            CI_S10_4_APPEARANCE="$(jq -r '.environment.appearance' <<< "$shard_json")"
            CI_S10_4_CONTRAST="$(jq -r '.environment.contrast' <<< "$shard_json")"
            CI_S10_4_CONTENT_SIZE_CATEGORY="$(jq -r '.environment.contentSizeCategory' <<< "$shard_json")"
            CI_S10_4_LOCALE="$(jq -r '.environment.locale' <<< "$shard_json")"
            CI_S10_4_LAYOUT_DIRECTION="$(jq -r '.environment.layoutDirection' <<< "$shard_json")"
            CI_S10_4_DIFFERENTIATE_WITHOUT_COLOR="$(jq -r '.environment.differentiateWithoutColor | tostring' <<< "$shard_json")"
            CI_S10_4_REDUCE_MOTION="$(jq -r '.environment.reduceMotion | tostring' <<< "$shard_json")"
            CI_S10_4_REDUCE_TRANSPARENCY="$(jq -r '.environment.reduceTransparency | tostring' <<< "$shard_json")"
          else
            test "$DISPATCH_S10_4_SHARD_ID" = "none"
          fi

          printf '%s\n' \
            "CI_TASK_ID=$CI_TASK_ID" \
            "CI_TIER=$CI_TIER" \
            "CI_RUN_UI_SMOKE=$CI_RUN_UI_SMOKE" \
            "CI_SETUP_ARTIFACT_TIMEOUT_SECONDS=$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS" \
            "CI_BUILD_TIMEOUT_SECONDS=$CI_BUILD_TIMEOUT_SECONDS" \
            "CI_TEST_TIMEOUT_SECONDS=$CI_TEST_TIMEOUT_SECONDS" \
            "CI_UI_TIMEOUT_SECONDS=$CI_UI_TIMEOUT_SECONDS" \
            "CI_TOTAL_BUDGET_SECONDS=$CI_TOTAL_BUDGET_SECONDS" \
            "CI_S10_4_SHARD_ID=$CI_S10_4_SHARD_ID" \
            "CI_ARTIFACT_SUFFIX=$CI_ARTIFACT_SUFFIX" \
            >> "$GITHUB_ENV"
          if test "$CI_TASK_ID" = "S10.4"; then
            printf '%s\n' \
              "SIMULATOR_RUNTIME=$SIMULATOR_RUNTIME" \
              "SIMULATOR_RUNTIME_BUILD=$SIMULATOR_RUNTIME_BUILD" \
              "SIMULATOR_NAME=$SIMULATOR_NAME" \
              "CI_S10_4_PROVISION_RUNTIME=$CI_S10_4_PROVISION_RUNTIME" \
              "CI_S10_4_RUNTIME_DOWNLOAD_VERSION=$CI_S10_4_RUNTIME_DOWNLOAD_VERSION" \
              "CI_S10_4_DEVICE_PROFILE_ID=$CI_S10_4_DEVICE_PROFILE_ID" \
              "CI_S10_4_SHARD_ORDINAL=$CI_S10_4_SHARD_ORDINAL" \
              "CI_S10_4_REQUIREMENT_ID=$CI_S10_4_REQUIREMENT_ID" \
              "CI_S10_4_ACCESSIBILITY_FEATURE=$CI_S10_4_ACCESSIBILITY_FEATURE" \
              "CI_S10_4_ACCESSIBILITY_FEATURES=$CI_S10_4_ACCESSIBILITY_FEATURES" \
              "CI_S10_4_APPEARANCE=$CI_S10_4_APPEARANCE" \
              "CI_S10_4_CONTRAST=$CI_S10_4_CONTRAST" \
              "CI_S10_4_CONTENT_SIZE_CATEGORY=$CI_S10_4_CONTENT_SIZE_CATEGORY" \
              "CI_S10_4_LOCALE=$CI_S10_4_LOCALE" \
              "CI_S10_4_LAYOUT_DIRECTION=$CI_S10_4_LAYOUT_DIRECTION" \
              "CI_S10_4_DIFFERENTIATE_WITHOUT_COLOR=$CI_S10_4_DIFFERENTIATE_WITHOUT_COLOR" \
              "CI_S10_4_REDUCE_MOTION=$CI_S10_4_REDUCE_MOTION" \
              "CI_S10_4_REDUCE_TRANSPARENCY=$CI_S10_4_REDUCE_TRANSPARENCY" \
              "TEST_RUNNER_CI_TASK_ID=$CI_TASK_ID" \
              "TEST_RUNNER_SIMULATOR_RUNTIME=$SIMULATOR_RUNTIME" \
              "TEST_RUNNER_SIMULATOR_RUNTIME_BUILD=$SIMULATOR_RUNTIME_BUILD" \
              "TEST_RUNNER_SIMULATOR_NAME=$SIMULATOR_NAME" \
              "TEST_RUNNER_CI_S10_4_SHARD_ID=$CI_S10_4_SHARD_ID" \
              "TEST_RUNNER_CI_S10_4_PROVISION_RUNTIME=$CI_S10_4_PROVISION_RUNTIME" \
              "TEST_RUNNER_CI_S10_4_RUNTIME_DOWNLOAD_VERSION=$CI_S10_4_RUNTIME_DOWNLOAD_VERSION" \
              "TEST_RUNNER_CI_S10_4_DEVICE_PROFILE_ID=$CI_S10_4_DEVICE_PROFILE_ID" \
              "TEST_RUNNER_CI_S10_4_SHARD_ORDINAL=$CI_S10_4_SHARD_ORDINAL" \
              "TEST_RUNNER_CI_S10_4_REQUIREMENT_ID=$CI_S10_4_REQUIREMENT_ID" \
              "TEST_RUNNER_CI_S10_4_ACCESSIBILITY_FEATURE=$CI_S10_4_ACCESSIBILITY_FEATURE" \
              "TEST_RUNNER_CI_S10_4_ACCESSIBILITY_FEATURES=$CI_S10_4_ACCESSIBILITY_FEATURES" \
              "TEST_RUNNER_CI_S10_4_APPEARANCE=$CI_S10_4_APPEARANCE" \
              "TEST_RUNNER_CI_S10_4_CONTRAST=$CI_S10_4_CONTRAST" \
              "TEST_RUNNER_CI_S10_4_CONTENT_SIZE_CATEGORY=$CI_S10_4_CONTENT_SIZE_CATEGORY" \
              "TEST_RUNNER_CI_S10_4_LOCALE=$CI_S10_4_LOCALE" \
              "TEST_RUNNER_CI_S10_4_LAYOUT_DIRECTION=$CI_S10_4_LAYOUT_DIRECTION" \
              "TEST_RUNNER_CI_S10_4_DIFFERENTIATE_WITHOUT_COLOR=$CI_S10_4_DIFFERENTIATE_WITHOUT_COLOR" \
              "TEST_RUNNER_CI_S10_4_REDUCE_MOTION=$CI_S10_4_REDUCE_MOTION" \
              "TEST_RUNNER_CI_S10_4_REDUCE_TRANSPARENCY=$CI_S10_4_REDUCE_TRANSPARENCY" \
              >> "$GITHUB_ENV"
          fi
          cp Scripts/ci-selection.json "$CI_ARTIFACT_DIR/ci-selection.json"
          if test "$CI_TASK_ID" = "S10.4"; then
            cp Scripts/s10-4-shards.json "$CI_ARTIFACT_DIR/s10-4-shards.json"
          fi
          printf 'task_id=%s\ntier=%s\ndispatch_run_ui_smoke=%s\ns10_4_shard_id=%s\n' \
            "$CI_TASK_ID" "$CI_TIER" "$DISPATCH_RUN_UI_SMOKE" "$CI_S10_4_SHARD_ID" \
            | tee "$CI_ARTIFACT_DIR/ci-selection-validation.txt"

      - name: Verify pinned toolchain, shared scheme, and simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          printf 'ImageOS=%s\nImageVersion=%s\nImageArch=%s\n' \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "${ImageArch:-unknown}" \
            | tee "$CI_ARTIFACT_DIR/runner-image.txt"
          printf 'repository=%s\nref=%s\nsha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$CI_ARTIFACT_DIR/github-run.txt"
          test -d "$DEVELOPER_DIR"
          test -f "$PROJECT_PATH/project.pbxproj"
          test -f "$PROJECT_PATH/xcshareddata/xcschemes/$SCHEME.xcscheme"
          test -f Scripts/ci-selection.json
          test -f Scripts/run-with-timeout.sh
          test -f Scripts/build-smoke.sh
          test -f Scripts/test-smoke.sh
          test -f Scripts/ui-smoke.sh
          test "$EXPECTED_MINIMUM_IOS" != "UNSET"
          xcodebuild -version | tee "$CI_ARTIFACT_DIR/xcode-version.txt"
          grep -Fxq "$EXPECTED_XCODE_VERSION" "$CI_ARTIFACT_DIR/xcode-version.txt"
          grep -Fxq "$EXPECTED_XCODE_BUILD" "$CI_ARTIFACT_DIR/xcode-version.txt"
          xcodebuild -list -json -project "$PROJECT_PATH" \
            | tee "$CI_ARTIFACT_DIR/xcode-list.json"
          jq -e --arg scheme "$SCHEME" \
            '.project.schemes | index($scheme) != null' \
            "$CI_ARTIFACT_DIR/xcode-list.json" > /dev/null
          xcodebuild -showBuildSettings -project "$PROJECT_PATH" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" | tee "$CI_ARTIFACT_DIR/build-settings.txt"
          deployment_targets="$(awk -F'= ' \
            '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / {print $2}' \
            "$CI_ARTIFACT_DIR/build-settings.txt" | LC_ALL=C sort -u)"
          target_count="$(printf '%s\n' "$deployment_targets" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$target_count" -eq 1
          test "$deployment_targets" = "$EXPECTED_MINIMUM_IOS"

          if test "${CI_TASK_ID:-}" = "S10.4" && \
             test "${CI_S10_4_PROVISION_RUNTIME:-}" = "true"; then
            test "$CI_S10_4_RUNTIME_DOWNLOAD_VERSION" = "18.0"
            setup_elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
            runtime_provision_budget_seconds="$(( CI_SETUP_ARTIFACT_TIMEOUT_SECONDS - setup_elapsed_seconds ))"
            test "$runtime_provision_budget_seconds" -gt 0
            set +e
            bash Scripts/run-with-timeout.sh "$runtime_provision_budget_seconds" \
              xcodebuild -downloadPlatform iOS \
                -buildVersion "$CI_S10_4_RUNTIME_DOWNLOAD_VERSION" \
              2>&1 | tee "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            provision_pipeline_status=( "${PIPESTATUS[@]}" )
            set -e
            if test "${#provision_pipeline_status[@]}" -ne 2; then
              exit 1
            fi
            printf '\nprovision_exit=%s\nprovision_tee_exit=%s\n' \
              "${provision_pipeline_status[0]}" "${provision_pipeline_status[1]}" \
              | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            if test "${provision_pipeline_status[1]}" -ne 0; then
              exit "${provision_pipeline_status[1]}"
            fi
            xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
            exact_runtime_available=false
            if jq -e --arg name "$SIMULATOR_RUNTIME" \
              --arg build "${SIMULATOR_RUNTIME_BUILD:-}" \
              'any(.runtimes[]; .name == $name and .isAvailable == true and ($build == "" or .buildversion == $build))' \
              "$CI_ARTIFACT_DIR/simulator-runtimes.json" > /dev/null; then
              exact_runtime_available=true
            fi
            if test "$exact_runtime_available" != true && \
               test -n "${SIMULATOR_RUNTIME_BUILD:-}"; then
              setup_elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
              runtime_recovery_budget_seconds="$(( CI_SETUP_ARTIFACT_TIMEOUT_SECONDS - setup_elapsed_seconds ))"
              test "$runtime_recovery_budget_seconds" -gt 0
              set +e
              bash Scripts/run-with-timeout.sh "$runtime_recovery_budget_seconds" \
                xcodebuild -downloadPlatform iOS \
                  -buildVersion "$SIMULATOR_RUNTIME_BUILD" \
                  -architectureVariant universal \
                2>&1 | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
              recovery_pipeline_status=( "${PIPESTATUS[@]}" )
              set -e
              if test "${#recovery_pipeline_status[@]}" -ne 2; then
                exit 1
              fi
              printf 'recovery_provision_exit=%s\nrecovery_provision_tee_exit=%s\n' \
                "${recovery_pipeline_status[0]}" "${recovery_pipeline_status[1]}" \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
              if test "${recovery_pipeline_status[1]}" -ne 0; then
                exit "${recovery_pipeline_status[1]}"
              fi
              xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
              if jq -e --arg name "$SIMULATOR_RUNTIME" \
                --arg build "${SIMULATOR_RUNTIME_BUILD:-}" \
                'any(.runtimes[]; .name == $name and .isAvailable == true and ($build == "" or .buildversion == $build))' \
                "$CI_ARTIFACT_DIR/simulator-runtimes.json" > /dev/null; then
                exact_runtime_available=true
              fi
            fi
            if test "$exact_runtime_available" != true; then
              if test "${provision_pipeline_status[0]}" -ne 0; then
                exit "${provision_pipeline_status[0]}"
              fi
              exit 70
            fi
            if test "${provision_pipeline_status[0]}" -ne 0; then
              printf 'provision_nonzero_but_exact_runtime_available=true\n' \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            else
              printf 'provision_zero_but_exact_runtime_verified=true\n' \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            fi
          fi

          xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
          xcrun simctl list devices available -j > "$CI_ARTIFACT_DIR/simulator-devices.json"
          runtime_id="$(jq -r --arg name "$SIMULATOR_RUNTIME" \
            --arg build "${SIMULATOR_RUNTIME_BUILD:-}" \
            '.runtimes[]
              | select(
                  .name == $name
                  and .isAvailable == true
                  and ($build == "" or .buildversion == $build)
                )
              | .identifier' \
            "$CI_ARTIFACT_DIR/simulator-runtimes.json" | head -n 1)"
          test -n "$runtime_id"
          simulator_udid="$(jq -r --arg runtime "$runtime_id" --arg name "$SIMULATOR_NAME" \
            '.devices[$runtime][] | select(.name == $name and .isAvailable == true) | .udid' \
            "$CI_ARTIFACT_DIR/simulator-devices.json" | head -n 1)"
          if test -z "$simulator_udid" && \
             test "${CI_TASK_ID:-}" = "S10.4" && \
             test "${CI_S10_4_PROVISION_RUNTIME:-}" = "true"; then
            xcrun simctl list devicetypes -j > "$CI_ARTIFACT_DIR/simulator-device-types.json"
            simulator_device_type_id="$(jq -r --arg name "$SIMULATOR_NAME" \
              '.devicetypes[] | select(.name == $name) | .identifier' \
              "$CI_ARTIFACT_DIR/simulator-device-types.json" | head -n 1)"
            test -n "$simulator_device_type_id"
            simulator_udid="$(xcrun simctl create \
              "$SIMULATOR_NAME" "$simulator_device_type_id" "$runtime_id")"
            test -n "$simulator_udid"
            xcrun simctl list devices available -j > "$CI_ARTIFACT_DIR/simulator-devices.json"
          fi
          test -n "$simulator_udid"
          simulator_state="$(jq -er --arg runtime "$runtime_id" --arg udid "$simulator_udid" '
            [.devices[$runtime][] | select(.udid == $udid) | .state]
            | if length == 1 then .[0]
              else error("expected exactly one selected Simulator state")
              end
          ' "$CI_ARTIFACT_DIR/simulator-devices.json")"
          case "$simulator_state" in
            Shutdown | Booted) ;;
            *) exit 1 ;;
          esac
          selected_runtime_build="$(jq -er --arg runtime "$runtime_id" \
            '.runtimes[] | select(.identifier == $runtime) | .buildversion' \
            "$CI_ARTIFACT_DIR/simulator-runtimes.json")"
          if test "${CI_TASK_ID:-}" = "S10.4"; then
            test "$selected_runtime_build" = "$SIMULATOR_RUNTIME_BUILD"
          fi
          printf 'runtime=%s\nruntime_build=%s\nname=%s\nudid=%s\ninitial_state=%s\n' \
            "$SIMULATOR_RUNTIME" "$selected_runtime_build" "$SIMULATOR_NAME" \
            "$simulator_udid" "$simulator_state" \
            | tee "$CI_ARTIFACT_DIR/simulator-selection.txt"
          printf 'CI_DESTINATION=platform=iOS Simulator,id=%s\nCI_SIMULATOR_UDID=%s\nCI_SIMULATOR_INITIAL_STATE=%s\n' \
            "$simulator_udid" "$simulator_udid" "$simulator_state" >> "$GITHUB_ENV"
          if test "${CI_TASK_ID:-}" = "S10.4"; then
            printf 'TEST_RUNNER_CI_SIMULATOR_UDID=%s\n' "$simulator_udid" >> "$GITHUB_ENV"
          fi

      - name: Verify setup budget before build
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_BUDGET_START_EPOCH:-}"
          test -n "${CI_SETUP_ARTIFACT_TIMEOUT_SECONDS:-}"
          setup_elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
          printf 'setup_elapsed_seconds=%s\nsetup_budget_seconds=%s\n' \
            "$setup_elapsed_seconds" "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS" \
            | tee "$CI_ARTIFACT_DIR/setup-budget.txt"
          printf 'CI_SETUP_ELAPSED_SECONDS=%s\n' \
            "$setup_elapsed_seconds" >> "$GITHUB_ENV"
          test "$setup_elapsed_seconds" -le "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS"

      # INFRA_RECOVERY_BEGIN: simulator-readiness-scheduling
      - name: Boot selected Simulator
        id: simulator_boot
        background: true
        shell: bash
        run: |
          set -euo pipefail
          test "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS" = "900"
          test -n "${CI_SIMULATOR_UDID:-}"
          case "${CI_SIMULATOR_INITIAL_STATE:-}" in
            Shutdown) simulator_boot_action="boot" ;;
            Booted) simulator_boot_action="already-booted" ;;
            *) exit 1 ;;
          esac
          simulator_boot_start_epoch="$(date +%s)"
          case "${CI_BUDGET_START_EPOCH:?}" in *[!0-9]* | "") exit 1 ;; esac
          case "$simulator_boot_start_epoch" in *[!0-9]* | "") exit 1 ;; esac
          test "$simulator_boot_start_epoch" -ge "$CI_BUDGET_START_EPOCH"
          printf 'start_epoch=%s\nudid=%s\ninitial_state=%s\naction=%s\nbudget_seconds=%s\ncommand=xcrun simctl bootstatus %s -b\n' \
            "$simulator_boot_start_epoch" "$CI_SIMULATOR_UDID" \
            "$CI_SIMULATOR_INITIAL_STATE" "$simulator_boot_action" \
            "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS" "$CI_SIMULATOR_UDID" \
            | tee "$CI_ARTIFACT_DIR/simulator-boot-start.log"
          printf 'CI_SIMULATOR_BOOT_START_EPOCH=%s\n' \
            "$simulator_boot_start_epoch" >> "$GITHUB_ENV"
          set +e
          bash Scripts/run-with-timeout.sh "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS" \
            xcrun simctl bootstatus "$CI_SIMULATOR_UDID" -b \
            2>&1 | tee "$CI_ARTIFACT_DIR/simulator-boot.log"
          simulator_boot_pipeline_status=( "${PIPESTATUS[@]}" )
          if test "${#simulator_boot_pipeline_status[@]}" -ne 2; then
            exit 1
          fi
          simulator_boot_end_epoch="$(date +%s)"
          printf '\nend_epoch=%s\nbootstatus_exit=%s\ntee_exit=%s\n' \
            "$simulator_boot_end_epoch" "${simulator_boot_pipeline_status[0]}" \
            "${simulator_boot_pipeline_status[1]}" \
            | tee -a "$CI_ARTIFACT_DIR/simulator-boot.log"
          simulator_boot_status_log_pipeline_status=( "${PIPESTATUS[@]}" )
          if test "${simulator_boot_pipeline_status[0]}" -ne 0; then
            exit "${simulator_boot_pipeline_status[0]}"
          fi
          if test "${simulator_boot_pipeline_status[1]}" -ne 0; then
            exit "${simulator_boot_pipeline_status[1]}"
          fi
          if test "${simulator_boot_status_log_pipeline_status[0]}" -ne 0; then
            exit "${simulator_boot_status_log_pipeline_status[0]}"
          fi
          if test "${simulator_boot_status_log_pipeline_status[1]}" -ne 0; then
            exit "${simulator_boot_status_log_pipeline_status[1]}"
          fi
          set -e
          case "$simulator_boot_end_epoch" in *[!0-9]* | "") exit 1 ;; esac
          test "$simulator_boot_end_epoch" -ge "$simulator_boot_start_epoch"
          simulator_boot_ready_elapsed_seconds="$(( simulator_boot_end_epoch - simulator_boot_start_epoch ))"
          printf 'ready_epoch=%s\nready_udid=%s\nready_elapsed_seconds=%s\nbudget_seconds=%s\n' \
            "$simulator_boot_end_epoch" "$CI_SIMULATOR_UDID" \
            "$simulator_boot_ready_elapsed_seconds" \
            "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS" \
            | tee -a "$CI_ARTIFACT_DIR/simulator-boot.log"
          test "$simulator_boot_ready_elapsed_seconds" -ge 0
          test "$simulator_boot_ready_elapsed_seconds" -le "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS"
          printf '%s\n' \
            "CI_SIMULATOR_READY_UDID=$CI_SIMULATOR_UDID" \
            "CI_SIMULATOR_READY_EPOCH=$simulator_boot_end_epoch" \
            "CI_SIMULATOR_READY_ELAPSED_SECONDS=$simulator_boot_ready_elapsed_seconds" \
            >> "$GITHUB_ENV"

      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/run-with-timeout.sh "$CI_BUILD_TIMEOUT_SECONDS" \
            bash Scripts/build-smoke.sh 2>&1 | tee "$CI_ARTIFACT_DIR/build-smoke.log"

      - name: Await selected Simulator boot
        wait: simulator_boot
      # INFRA_RECOVERY_END: simulator-readiness-scheduling

      - name: Run targeted tests
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/run-with-timeout.sh "$CI_TEST_TIMEOUT_SECONDS" \
            bash Scripts/test-smoke.sh 2>&1 | tee "$CI_ARTIFACT_DIR/test-smoke.log"

      - name: Run task-authorized UI smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke == true }}
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/run-with-timeout.sh "$CI_UI_TIMEOUT_SECONDS" \
            bash Scripts/ui-smoke.sh 2>&1 | tee "$CI_ARTIFACT_DIR/ui-smoke.log"

      - name: Retain S10.4 shard evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke == true && inputs.s10_4_shard_id != 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CI_TASK_ID" = "S10.4"
          test "$CI_S10_4_SHARD_ID" = "${{ inputs.s10_4_shard_id }}"
          test -d "$RUNNER_TEMP/FieldEvidenceUISmokeAttachments"
          attachment_export_path="$RUNNER_TEMP/FieldEvidenceUISmokeAttachments"
          attachment_manifest_path="$attachment_export_path/manifest.json"
          test -s "$attachment_manifest_path"

          shard_evidence_path="$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID"
          candidate_path="$shard_evidence_path/candidates"
          state_ax_path="$CI_ARTIFACT_DIR/ax/$CI_S10_4_SHARD_ID"
          state_contrast_path="$CI_ARTIFACT_DIR/contrast/$CI_S10_4_SHARD_ID"
          task_accessibility_path="$CI_ARTIFACT_DIR/accessibility/$CI_S10_4_SHARD_ID"
          mkdir -p \
            "$candidate_path" \
            "$state_ax_path" \
            "$state_contrast_path" \
            "$task_accessibility_path"
          cp "$attachment_manifest_path" "$shard_evidence_path/xcresult-attachment-manifest.json"

          candidate_prefix="S10.4 candidate $CI_S10_4_SHARD_ID "
          jq -e \
            --arg prefix "$candidate_prefix" '
              [
                .[]
                | select(
                    type == "object"
                    and (.testIdentifier | type == "string")
                    and (.testIdentifier | startswith("S10_4AutomatedBrandLabUITests/"))
                    and (.attachments | type == "array")
                  )
                | .attachments[]
                | select(
                    type == "object"
                    and .isAssociatedWithFailure == false
                    and (.suggestedHumanReadableName | type == "string")
                    and (.suggestedHumanReadableName | startswith($prefix))
                    and (.exportedFileName | type == "string")
                    and (.exportedFileName | test("^[A-Za-z0-9._-]+$"))
                  )
                | {
                    stateID: (.suggestedHumanReadableName | ltrimstr($prefix) | sub("_0_[0-9A-Fa-f-]{36}\\."; ".")),
                    exportedFileName: .exportedFileName
                  }
              ]
              | if length == 67 then .
                else error("expected exactly 67 S10.4 candidate PNG-data attachments")
                end
              | if ([.[].stateID] | unique | length) == 67 then .
                else error("duplicate S10.4 candidate state attachment")
                end
              | if ([.[].exportedFileName] | unique | length) == 67 then .
                else error("duplicate S10.4 exported candidate file")
                end
            ' "$attachment_manifest_path" > "$shard_evidence_path/candidate-exports.json"

          jq '[.routes[].states[].state_id] | sort' \
            docs/design/s10/s10-screen-state-inventory.json \
            > "$RUNNER_TEMP/s10-4-expected-states.json"
          jq '[.[].stateID] | sort' "$shard_evidence_path/candidate-exports.json" \
            > "$RUNNER_TEMP/s10-4-observed-states.json"
          cmp -s "$RUNNER_TEMP/s10-4-expected-states.json" \
            "$RUNNER_TEMP/s10-4-observed-states.json"

          : > "$RUNNER_TEMP/s10-4-candidate-files.tsv"
          while IFS=$'\t' read -r state_id exported_file_name; do
            test -n "$state_id"
            test -n "$exported_file_name"
            case "$state_id" in state.*) ;; *) exit 1 ;; esac
            source_path="$attachment_export_path/$exported_file_name"
            destination_name="$state_id.png"
            destination_path="$candidate_path/$destination_name"
            test -f "$source_path"
            test ! -L "$source_path"
            test "$(LC_ALL=C od -An -tx1 -N8 "$source_path" \
              | tr -d '[:space:]' \
              | tr '[:upper:]' '[:lower:]')" = "89504e470d0a1a0a"
            cp "$source_path" "$destination_path"
            cmp -s "$source_path" "$destination_path"
            candidate_sha256="$(shasum -a 256 "$destination_path" | awk '{print toupper($1)}')"
            candidate_bytes="$(stat -f '%z' "$destination_path")"
            printf '%s\t%s\t%s\t%s\n' \
              "$state_id" "candidates/$destination_name" \
              "$candidate_sha256" "$candidate_bytes" \
              >> "$RUNNER_TEMP/s10-4-candidate-files.tsv"
          done < <(jq -r '.[] | [.stateID, .exportedFileName] | @tsv' \
            "$shard_evidence_path/candidate-exports.json")

          jq -Rn '
            [
              inputs
              | split("\t")
              | {
                  stateID: .[0],
                  artifactPath: .[1],
                  sha256: .[2],
                  bytes: (.[3] | tonumber)
                }
            ]
          ' < "$RUNNER_TEMP/s10-4-candidate-files.tsv" \
            > "$shard_evidence_path/candidate-files.json"
          test "$(jq 'length' "$shard_evidence_path/candidate-files.json")" -eq 67

          contrast_exception_authority_path="$RUNNER_TEMP/s10-4-contrast-exceptions.json"
          jq -n '
            [
              {
                shardID: "s10.4.current.default-dark",
                stateID: "state.sample-report.ready",
                taskID: "report_comprehension",
                exceptionIssueID: "S10.4-XCUI-CONTRAST-FP-DEFAULT-DARK-WIDE-VIEW",
                exceptionOwner: "palatis3",
                exceptionExpiresAt: "2026-11-20",
                exceptionRationale: "Xcode 26.6/iOS 26.2 reports a SwiftUI.AccessibilityNode contrast issue for Wide view even though the audit-owned crop visibly renders white text on the dark elevated Sample card; the exception is limited to the frozen public issue signature.",
                ignoredAuditIssues: [
                  {
                    auditTypeRawValue: "1",
                    compactDescription: "Contrast failed",
                    detailedDescription: "Contrast failed for SwiftUI.AccessibilityNode",
                    elementIdentifier: "",
                    elementLabel: "Wide view",
                    elementType: "XCUIElementType(rawValue: 48)",
                    elementFrame: {
                      x: 32,
                      y: 810.33333333333337,
                      width: 80,
                      height: 20.333333333333258
                    },
                    applicationFrame: {x: 0, y: 0, width: 402, height: 874}
                  }
                ]
              },
              {
                shardID: "s10.4.current.ax-text",
                stateID: "state.check-preflight.ready",
                taskID: "one_handed_start",
                exceptionIssueID: "S10.4-XCUI-CONTRAST-FP-AX-TEXT-PREFLIGHT-BEFORE-YOU-BEGIN",
                exceptionOwner: "palatis3",
                exceptionExpiresAt: "2026-11-20",
                exceptionRationale: "Xcode 26.6/iOS 26.2 reports a SwiftUI.AccessibilityNode contrast issue for Before you begin while the frozen public node frame is bottom-clipped outside the 402x874 application frame in the AX-text preflight state; the exception is limited to the frozen public issue signature.",
                ignoredAuditIssues: [
                  {
                    auditTypeRawValue: "1",
                    compactDescription: "Contrast failed",
                    detailedDescription: "Contrast failed for SwiftUI.AccessibilityNode",
                    elementIdentifier: "",
                    elementLabel: "Before you begin",
                    elementType: "XCUIElementType(rawValue: 48)",
                    elementFrame: {
                      x: 32,
                      y: 844.33333333333337,
                      width: 231,
                      height: 125.33333333333326
                    },
                    applicationFrame: {x: 0, y: 0, width: 402, height: 874}
                  }
                ]
              },
              {
                shardID: "s10.4.current.ax-text",
                stateID: "state.new-sign.editing",
                taskID: "one_handed_start",
                exceptionIssueID: "S10.4-XCUI-CONTRAST-FP-AX-TEXT-CUSTOMER-SITE-NAME",
                exceptionOwner: "palatis3",
                exceptionExpiresAt: "2026-11-20",
                exceptionRationale: "Xcode 26.6/iOS 26.2 reports a SwiftUI.AccessibilityNode contrast issue for Customer / site name even though the audit-owned crop visibly renders black text on white and the public node is bound to the top navigation-region frame; the exception is limited to the frozen public issue signature.",
                ignoredAuditIssues: [
                  {
                    auditTypeRawValue: "1",
                    compactDescription: "Contrast failed",
                    detailedDescription: "Contrast failed for SwiftUI.AccessibilityNode",
                    elementIdentifier: "",
                    elementLabel: "Customer / site name",
                    elementType: "XCUIElementType(rawValue: 48)",
                    elementFrame: {
                      x: 32,
                      y: 19,
                      width: 251.66666666666663,
                      height: 116.66666666666663
                    },
                    applicationFrame: {x: 0, y: 0, width: 402, height: 874}
                  }
                ]
              }
            ]
          ' > "$contrast_exception_authority_path"
          jq -e --arg today "$(date -u +%F)" '
            length == 3
            and ([.[] | [.shardID, .stateID] | join("|")] | unique | length) == 3
            and ([.[].exceptionIssueID] | unique | length) == 3
            and ([.[] | {shardID, stateID, taskID}] | sort_by(.shardID, .stateID)) == ([
              {
                shardID: "s10.4.current.ax-text",
                stateID: "state.check-preflight.ready",
                taskID: "one_handed_start"
              },
              {
                shardID: "s10.4.current.ax-text",
                stateID: "state.new-sign.editing",
                taskID: "one_handed_start"
              },
              {
                shardID: "s10.4.current.default-dark",
                stateID: "state.sample-report.ready",
                taskID: "report_comprehension"
              }
            ] | sort_by(.shardID, .stateID))
            and all(.[];
              ((keys | sort) == ([
                "shardID", "stateID", "taskID", "exceptionIssueID",
                "exceptionOwner", "exceptionExpiresAt", "exceptionRationale",
                "ignoredAuditIssues"
              ] | sort))
              and (.exceptionIssueID | type == "string" and length > 0)
              and (.exceptionOwner == "palatis3")
              and (.exceptionExpiresAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
              and ($today <= .exceptionExpiresAt)
              and (.exceptionRationale | type == "string" and length > 0)
              and (.ignoredAuditIssues | type == "array" and length == 1)
            )
          ' "$contrast_exception_authority_path" > /dev/null

          sed -n 's/^S10_4_CONTRAST //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$shard_evidence_path/contrast.ndjson"
          jq -s '.' "$shard_evidence_path/contrast.ndjson" \
            > "$shard_evidence_path/contrast.json"
          test "$(jq 'length' "$shard_evidence_path/contrast.json")" -eq 67

          sed -n 's/^S10_4_AX //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$shard_evidence_path/accessibility.ndjson"
          jq -s '.' "$shard_evidence_path/accessibility.ndjson" \
            > "$shard_evidence_path/accessibility.json"
          expected_accessibility_rows="$(( \
            $(if test -z "$CI_S10_4_ACCESSIBILITY_FEATURES"; then printf '0'; \
              else awk -F',' '{print NF}' <<< "$CI_S10_4_ACCESSIBILITY_FEATURES"; fi) * 6 \
          ))"
          test "$(jq 'length' "$shard_evidence_path/accessibility.json")" \
            -eq "$expected_accessibility_rows"
          jq -e \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" \
            --arg features "$CI_S10_4_ACCESSIBILITY_FEATURES" \
            --arg shard "$CI_S10_4_SHARD_ID" \
            --arg today "$(date -u +%F)" \
            --slurpfile contract docs/design/s10/s10-accessibility-common-tasks.json \
            --slurpfile contrasts "$shard_evidence_path/contrast.json" \
            --slurpfile exceptions "$contrast_exception_authority_path" '
              def baseEvidence($shardID; $taskID): [
                "s10.4-ax-" + $shardID + "-" + $taskID,
                "s10.4-focus-order-" + $shardID + "-" + $taskID,
                "s10.4-target-size-" + $shardID + "-" + $taskID,
                "s10.4-contrast-" + $shardID + "-" + $taskID
              ];
              def exceptionEvidence: {
                exceptionIssueID,
                exceptionOwner,
                exceptionExpiresAt,
                exceptionRationale,
                ignoredAuditIssues
              };
              ($features | if length == 0 then [] else split(",") end) as $expectedFeatures
              | ($contract[0].tasks | map(.task_id)) as $expectedTasks
              | ($contrasts[0]
                  | map(select(.result == "EXCEPTION"))
                  | sort_by(.stateID)) as $stateExceptions
              | ($exceptions[0]
                  | map(select(.shardID == $shard))
                  | sort_by(.stateID)) as $shardAuthorities
              | (if ([ $stateExceptions[].stateID ] | unique | length) != ($stateExceptions | length) then
                   error("duplicate contrast exception state")
                 elif $shard == "s10.4.current.default-dark" and ($stateExceptions | length) > 1 then
                   error("more than one default-dark contrast exception")
                 elif $shard == "s10.4.current.ax-text" and ($stateExceptions | length) > 2 then
                   error("more than two AX-text contrast exceptions")
                 elif $shard != "s10.4.current.default-dark"
                      and $shard != "s10.4.current.ax-text"
                      and ($stateExceptions | length) != 0 then
                   error("contrast exception on ineligible shard")
                 else
                   $stateExceptions
                 end) as $boundedStateExceptions
              | ($boundedStateExceptions | map(
                  . as $stateException
                  | ($shardAuthorities
                      | map(select(.stateID == $stateException.stateID))) as $matches
                  | if ($matches | length) != 1 then
                      error("unmatched or ambiguous contrast exception authority")
                    elif ($matches[0].exceptionExpiresAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") | not)
                         or $today > $matches[0].exceptionExpiresAt then
                      error("expired or malformed contrast exception authority")
                    elif (($stateException | exceptionEvidence) != ($matches[0] | exceptionEvidence)) then
                      error("contrast exception metadata drift")
                    else
                      $matches[0]
                    end
                )) as $matchedAuthorities
              | all(.[];
                  . as $row
                  | .taskID as $taskID
                  | ($matchedAuthorities
                      | map(select(.taskID == $taskID))
                      | sort_by(.stateID)) as $taskExceptions
                  | ($taskExceptions | map(.exceptionOwner) | unique) as $exceptionOwners
                  | ($taskExceptions | map(.exceptionExpiresAt) | unique) as $exceptionExpiries
                  | type == "object"
                  and ((keys | sort) == ([
                    "taskID", "shardID", "deviceProfileID", "feature",
                    "automatedStatus", "automatedReviewer", "evidenceID",
                    "focusOrderEvidenceID", "targetSizeEvidenceID", "contrastEvidenceID",
                    "automatedEvidenceIDs", "exceptionIssueID", "exceptionOwner",
                    "exceptionExpiresAt", "exceptionRationale", "exceptionStateIDs",
                    "rationale", "aggregateAXTreeSHA256", "stateCount", "stateSetSHA256",
                    "stateAXTreeDigests"
                  ] | sort))
                  and (.taskID | type == "string" and IN($expectedTasks[]))
                  and (.shardID == $shard)
                  and (.deviceProfileID == $profile)
                  and (.feature | type == "string" and IN($expectedFeatures[]))
                  and (.automatedReviewer == "FieldEvidenceAppUITests/S10_4AutomatedBrandLabUITests")
                  and (.evidenceID == ("s10.4-ax-" + $shard + "-" + $taskID))
                  and (.focusOrderEvidenceID == ("s10.4-focus-order-" + $shard + "-" + $taskID))
                  and (.targetSizeEvidenceID == ("s10.4-target-size-" + $shard + "-" + $taskID))
                  and (.contrastEvidenceID == ("s10.4-contrast-" + $shard + "-" + $taskID))
                  and (.aggregateAXTreeSHA256 | type == "string" and test("^[0-9A-F]{64}$"))
                  and (.stateCount | type == "number" and . > 0)
                  and (
                    if ($taskExceptions | length) > 0 then
                      (.automatedStatus == "EXCEPTION")
                      and (.automatedEvidenceIDs == (
                        baseEvidence($shard; $taskID)
                        + ($taskExceptions | map(
                            "s10.4-contrast-" + $shard + "-" + .stateID
                          ))
                      ))
                      and (.exceptionIssueID == ($taskExceptions
                        | map(.exceptionIssueID) | join(" | ")))
                      and ($exceptionOwners | length) == 1
                      and (.exceptionOwner == $exceptionOwners[0])
                      and ($exceptionExpiries | length) == 1
                      and (.exceptionExpiresAt == $exceptionExpiries[0])
                      and ($today <= .exceptionExpiresAt)
                      and (.exceptionRationale == ($taskExceptions
                        | map(.exceptionRationale) | join(" | ")))
                      and (.exceptionStateIDs == ($taskExceptions | map(.stateID)))
                      and (.rationale == (
                        if ($taskExceptions | length) == 1 then
                          "All task states produced AX-tree, focus-order, and target-size evidence; the sole Apple contrast issue is bound to the named, expiring exception."
                        else
                          "All task states produced AX-tree, focus-order, and target-size evidence; the exact Apple contrast issues are bound to the named, expiring exceptions."
                        end
                      ))
                      and all($taskExceptions[];
                        .stateID as $exceptionStateID
                        | ($row.stateAXTreeDigests | map(.stateID)
                          | index($exceptionStateID)) != null
                      )
                    else
                      (.automatedStatus == "PASS")
                      and (.automatedEvidenceIDs == baseEvidence($shard; $taskID))
                      and (.exceptionIssueID == "")
                      and (.exceptionOwner == "")
                      and (.exceptionExpiresAt == "")
                      and (.exceptionRationale == "")
                      and (.exceptionStateIDs == [])
                      and (.rationale == "All task states produced AX-tree, focus-order, target-size, and strict Apple contrast evidence.")
                    end
                  )
                )
                and ([.[] | [.taskID, .deviceProfileID, .feature] | join("|")] as $keys
                  | ($keys | unique | length) == ($keys | length))
                and ([.[] | .taskID] | unique | sort) ==
                  (if ($expectedFeatures | length) == 0 then [] else ($expectedTasks | sort) end)
                and ([.[] | .feature] | unique | sort) == ($expectedFeatures | sort)
            ' "$shard_evidence_path/accessibility.json" > /dev/null

          while IFS= read -r task_row; do
            task_id="$(jq -r '.taskID' <<< "$task_row")"
            case "$task_id" in
              ''|*[!a-z0-9_]*) exit 1 ;;
            esac
            jq -cS --arg productHead "$GITHUB_SHA" \
              '. + {sourceProductHead: $productHead}' \
              <<< "$task_row" \
              > "$task_accessibility_path/$task_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/accessibility.json")
          test "$(find "$task_accessibility_path" -type f -name '*.json' | wc -l | tr -d ' ')" \
            -eq "$expected_accessibility_rows"

          sed -n 's/^S10_4_AX_STATE //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$shard_evidence_path/state-ax.ndjson"
          jq -s '.' "$shard_evidence_path/state-ax.ndjson" \
            > "$shard_evidence_path/state-ax.json"
          test "$(jq 'length' "$shard_evidence_path/state-ax.json")" -eq 67
          jq -e \
            --arg shard "$CI_S10_4_SHARD_ID" \
            --arg requirement "$CI_S10_4_REQUIREMENT_ID" \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" \
            --slurpfile inventory docs/design/s10/s10-screen-state-inventory.json '
              ($inventory[0] | [.routes[].states[].state_id] | sort) as $expectedStates
              | all(.[];
                  type == "object"
                  and (.stateID | type == "string" and IN($expectedStates[]))
                  and (.shardID == $shard)
                  and (.requirementID == $requirement)
                  and (.deviceProfileID == $profile)
                  and (.result == "PASS")
                  and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .stateID))
                  and (.axTreeSHA256 | type == "string" and test("^[0-9A-F]{64}$"))
                  and (.capture == "XCUIApplication.debugDescription")
                )
                and ([.[].stateID] | unique | length == 67)
                and ([.[].stateID] | sort) == $expectedStates
            ' "$shard_evidence_path/state-ax.json" > /dev/null

          while IFS= read -r state_ax_row; do
            state_id="$(jq -r '.stateID' <<< "$state_ax_row")"
            case "$state_id" in state.*) ;; *) exit 1 ;; esac
            jq -cS --arg productHead "$GITHUB_SHA" \
              '. + {sourceProductHead: $productHead}' \
              <<< "$state_ax_row" \
              > "$state_ax_path/$state_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/state-ax.json")
          test "$(find "$state_ax_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67

          jq -e \
            --arg shard "$CI_S10_4_SHARD_ID" \
            --arg requirement "$CI_S10_4_REQUIREMENT_ID" \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" \
            --arg today "$(date -u +%F)" \
            --slurpfile inventory docs/design/s10/s10-screen-state-inventory.json \
            --slurpfile exceptions "$contrast_exception_authority_path" '
              def exceptionEvidence: {
                exceptionIssueID,
                exceptionOwner,
                exceptionExpiresAt,
                exceptionRationale,
                ignoredAuditIssues
              };
              ($inventory[0] | [.routes[].states[].state_id] | sort) as $expectedStates
              | all(.[];
                  . as $row
                  | ($exceptions[0]
                      | map(select(.shardID == $row.shardID and .stateID == $row.stateID))
                      | .[0] // null) as $authorizedException
                  | type == "object"
                  and ((keys | sort) == ([
                    "shardID", "stateID", "requirementID", "deviceProfileID",
                    "result", "evidenceID", "axTreeSHA256", "audit",
                    "exceptionIssueID", "exceptionOwner", "exceptionExpiresAt",
                    "exceptionRationale", "ignoredAuditIssues"
                  ] | sort))
                  and (.stateID | type == "string" and IN($expectedStates[]))
                  and (.shardID == $shard)
                  and (.requirementID == $requirement)
                  and (.deviceProfileID == $profile)
                  and (.evidenceID == ("s10.4-contrast-" + $shard + "-" + .stateID))
                  and (.axTreeSHA256 | type == "string" and test("^[0-9A-F]{64}$"))
                  and (.audit == "XCUIAccessibilityAuditType.contrast")
                  and (
                    if .result == "PASS" then
                      ((. | exceptionEvidence) == {
                        exceptionIssueID: "",
                        exceptionOwner: "",
                        exceptionExpiresAt: "",
                        exceptionRationale: "",
                        ignoredAuditIssues: []
                      })
                    elif .result == "EXCEPTION" then
                      ($authorizedException != null)
                      and ($authorizedException.exceptionExpiresAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                      and ($today <= $authorizedException.exceptionExpiresAt)
                      and ((. | exceptionEvidence) == ($authorizedException | exceptionEvidence))
                    else
                      false
                    end
                  )
                )
                and ([.[].stateID] | unique | length == 67)
                and ([.[].stateID] | sort) == $expectedStates
                and (
                  ([.[] | select(.result == "EXCEPTION")]
                    | sort_by(.stateID)) as $stateExceptions
                  | all($stateExceptions[];
                      . as $stateException
                      | any($exceptions[0][];
                          .shardID == $shard
                          and .stateID == $stateException.stateID
                        )
                    )
                    and (
                      if $shard == "s10.4.current.default-dark" then
                        ($stateExceptions | length) <= 1
                      elif $shard == "s10.4.current.ax-text" then
                        ($stateExceptions | length) <= 2
                      else
                        ($stateExceptions | length) == 0
                      end
                    )
                )
            ' "$shard_evidence_path/contrast.json" > /dev/null

          while IFS= read -r contrast_row; do
            state_id="$(jq -r '.stateID' <<< "$contrast_row")"
            case "$state_id" in state.*) ;; *) exit 1 ;; esac
            jq -cS --arg productHead "$GITHUB_SHA" \
              '. + {sourceProductHead: $productHead}' \
              <<< "$contrast_row" \
              > "$state_contrast_path/$state_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/contrast.json")
          test "$(find "$state_contrast_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67

          jq -n \
            --arg taskID "$CI_TASK_ID" \
            --arg shardID "$CI_S10_4_SHARD_ID" \
            --arg requirementID "$CI_S10_4_REQUIREMENT_ID" \
            --arg deviceProfileID "$CI_S10_4_DEVICE_PROFILE_ID" \
            --arg runtime "$SIMULATOR_RUNTIME" \
            --arg runtimeBuild "$SIMULATOR_RUNTIME_BUILD" \
            --arg simulatorName "$SIMULATOR_NAME" \
            --arg productHead "$GITHUB_SHA" \
            --argjson candidateCount 67 \
            --argjson stateAXRowCount 67 \
            --argjson accessibilityRowCount "$expected_accessibility_rows" \
            --argjson contrastRowCount 67 '
              {
                schemaVersion: 1,
                taskID: $taskID,
                shardID: $shardID,
                requirementID: $requirementID,
                deviceProfileID: $deviceProfileID,
                runtime: $runtime,
                runtimeBuild: $runtimeBuild,
                simulatorName: $simulatorName,
                productHead: $productHead,
                candidateCount: $candidateCount,
                stateAXRowCount: $stateAXRowCount,
                accessibilityRowCount: $accessibilityRowCount,
                contrastRowCount: $contrastRowCount
              }
            ' > "$shard_evidence_path/shard-receipt.json"

      - name: Begin evidence-finalization budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CI_ARTIFACT_START_EPOCH="$(date +%s)"
          printf 'CI_ARTIFACT_START_EPOCH=%s\n' "$CI_ARTIFACT_START_EPOCH" >> "$GITHUB_ENV"

      - name: Validate required build and test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          require_nonempty_directory() {
            test -d "$1"
            test -n "$(find "$1" -mindepth 1 -print -quit)"
          }

          verify_executed_selectors() {
            local result_bundle="$1"
            local selectors_key="$2"
            local bundle_type="$3"
            local output_stem="$4"
            local test_results="$CI_ARTIFACT_DIR/${output_stem}-test-results.json"
            local executed_tests="$CI_ARTIFACT_DIR/${output_stem}-executed-tests.json"

            xcrun xcresulttool get test-results tests \
              --path "$result_bundle" --compact > "$test_results"
            test -s "$test_results"

            jq --arg bundleType "$bundle_type" '
              def normalize_identifier:
                sub("\\(\\)$"; "");
              def executed_cases($bundleName; $bundleType):
                . as $node
                | (
                    if $node.nodeType? == $bundleType
                    then ($node.name? // "")
                    else $bundleName
                    end
                  ) as $nextBundle
                | if (
                    $node.nodeType? == "Test Case"
                    and ($nextBundle | type == "string" and length > 0)
                    and ($node.nodeIdentifier? | type == "string" and length > 0)
                    and (
                      ($node.result? == "Passed")
                      or ($node.result? == "Failed")
                      or ($node.result? == "Expected Failure")
                    )
                  )
                  then
                    ($node.nodeIdentifier | normalize_identifier) as $identifier
                    | {
                        identifier: (
                          if ($identifier | startswith($nextBundle + "/"))
                          then $identifier
                          else ($nextBundle + "/" + $identifier)
                          end
                        ),
                        result: $node.result
                      }
                  else
                    ($node.children[]? | executed_cases($nextBundle; $bundleType))
                  end;
              [
                .testNodes[]?
                | executed_cases(null; $bundleType)
              ]
              | sort_by(.identifier)
              | unique_by(.identifier)
            ' "$test_results" > "$executed_tests"
            test -s "$executed_tests"

            jq -e --arg key "$selectors_key" --slurpfile executed "$executed_tests" '
              def normalize_identifier:
                sub("\\(\\)$"; "");
              .[$key] as $selectors
              | ($executed[0] // []) as $actual
              | (($actual | type) == "array" and ($actual | length) > 0)
                and all(
                  $selectors[];
                  . as $selector
                  | ($selector | normalize_identifier) as $wanted
                  | any(
                      $actual[];
                      (.identifier | normalize_identifier) as $observed
                      | ($observed == $wanted)
                        or ($observed | startswith($wanted + "/"))
                    )
                )
            ' Scripts/ci-selection.json > /dev/null
          }

          test -s "$CI_ARTIFACT_DIR/simulator-boot-start.log"
          test -s "$CI_ARTIFACT_DIR/simulator-boot.log"
          test -s "$CI_ARTIFACT_DIR/build-smoke.log"
          test -s "$CI_ARTIFACT_DIR/test-smoke.log"
          require_nonempty_directory "$CI_ARTIFACT_DIR/Build.xcresult"
          require_nonempty_directory "$CI_ARTIFACT_DIR/UnitTests.xcresult"
          verify_executed_selectors \
            "$CI_ARTIFACT_DIR/UnitTests.xcresult" \
            unitTestSelectors "Unit test bundle" unit

          if test "${CI_RUN_UI_SMOKE:-}" = "true"; then
            test -s "$CI_ARTIFACT_DIR/ui-smoke.log"
            require_nonempty_directory "$CI_ARTIFACT_DIR/UISmoke.xcresult"
            test -s "$CI_ARTIFACT_DIR/ui-final.png"
            verify_executed_selectors \
              "$CI_ARTIFACT_DIR/UISmoke.xcresult" \
              uiTestSelectors "UI test bundle" ui
            if test "${CI_TASK_ID:-}" = "S10.4"; then
              test "${CI_S10_4_SHARD_ID:-none}" != "none"
              shard_evidence_path="$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID"
              require_nonempty_directory "$shard_evidence_path/candidates"
              test "$(find "$shard_evidence_path/candidates" -type f -name 'state.*.png' \
                | wc -l | tr -d ' ')" -eq 67
              test -s "$shard_evidence_path/xcresult-attachment-manifest.json"
              test -s "$shard_evidence_path/candidate-exports.json"
              test -s "$shard_evidence_path/candidate-files.json"
              test -s "$shard_evidence_path/accessibility.ndjson"
              test -s "$shard_evidence_path/accessibility.json"
              test -s "$shard_evidence_path/contrast.ndjson"
              test -s "$shard_evidence_path/contrast.json"
              test -s "$shard_evidence_path/shard-receipt.json"
              test "$(jq 'length' "$shard_evidence_path/candidate-files.json")" -eq 67
              test "$(jq 'length' "$shard_evidence_path/accessibility.json")" -eq 6
              test "$(jq 'length' "$shard_evidence_path/contrast.json")" -eq 67
              state_ax_path="$CI_ARTIFACT_DIR/ax/$CI_S10_4_SHARD_ID"
              state_contrast_path="$CI_ARTIFACT_DIR/contrast/$CI_S10_4_SHARD_ID"
              task_accessibility_path="$CI_ARTIFACT_DIR/accessibility/$CI_S10_4_SHARD_ID"
              require_nonempty_directory "$state_ax_path"
              require_nonempty_directory "$state_contrast_path"
              require_nonempty_directory "$task_accessibility_path"
              test "$(find "$state_ax_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67
              test "$(find "$state_contrast_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67
              test "$(find "$task_accessibility_path" -type f -name '*.json' | wc -l | tr -d ' ')" -eq 6

              jq -r '.routes[].states[].state_id + ".json"' \
                docs/design/s10/s10-screen-state-inventory.json \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-expected-state-evidence-files.txt"
              find "$state_ax_path" -type f -name 'state.*.json' -exec basename {} \; \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-observed-ax-files.txt"
              find "$state_contrast_path" -type f -name 'state.*.json' -exec basename {} \; \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-observed-contrast-files.txt"
              cmp -s "$RUNNER_TEMP/s10-4-expected-state-evidence-files.txt" \
                "$RUNNER_TEMP/s10-4-observed-ax-files.txt"
              cmp -s "$RUNNER_TEMP/s10-4-expected-state-evidence-files.txt" \
                "$RUNNER_TEMP/s10-4-observed-contrast-files.txt"

              jq -r '.tasks[].task_id + ".json"' \
                docs/design/s10/s10-accessibility-common-tasks.json \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-expected-task-evidence-files.txt"
              find "$task_accessibility_path" -type f -name '*.json' -exec basename {} \; \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-observed-task-evidence-files.txt"
              cmp -s "$RUNNER_TEMP/s10-4-expected-task-evidence-files.txt" \
                "$RUNNER_TEMP/s10-4-observed-task-evidence-files.txt"

              for evidence_file in "$state_ax_path"/*.json; do
                jq -e \
                  --arg shard "$CI_S10_4_SHARD_ID" \
                  --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .stateID))
                    and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                  ' "$evidence_file" > /dev/null
              done
              for evidence_file in "$state_contrast_path"/*.json; do
                jq -e \
                  --arg shard "$CI_S10_4_SHARD_ID" \
                  --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-contrast-" + $shard + "-" + .stateID))
                    and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                  ' "$evidence_file" > /dev/null
              done
              for evidence_file in "$task_accessibility_path"/*.json; do
                jq -e \
                  --arg shard "$CI_S10_4_SHARD_ID" \
                  --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .taskID))
                    and (.focusOrderEvidenceID == ("s10.4-focus-order-" + $shard + "-" + .taskID))
                    and (.targetSizeEvidenceID == ("s10.4-target-size-" + $shard + "-" + .taskID))
                    and (.contrastEvidenceID == ("s10.4-contrast-" + $shard + "-" + .taskID))
                  ' "$evidence_file" > /dev/null
              done
            fi
          else
            test "${CI_RUN_UI_SMOKE:-}" = "false"
            test ! -e "$CI_ARTIFACT_DIR/ui-smoke.log"
            test ! -e "$CI_ARTIFACT_DIR/UISmoke.xcresult"
            test ! -e "$CI_ARTIFACT_DIR/ui-final.png"
          fi

      - name: Hash collected evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          checksum_file="$RUNNER_TEMP/FieldEvidenceCI-checksums.txt"
          rm -f "$CI_ARTIFACT_DIR/SHA256SUMS.txt"
          test -n "${CI_ARTIFACT_START_EPOCH:-}"
          test -n "${CI_SETUP_ARTIFACT_TIMEOUT_SECONDS:-}"
          test -n "${CI_SETUP_ELAPSED_SECONDS:-}"
          artifact_elapsed_seconds="$(( $(date +%s) - CI_ARTIFACT_START_EPOCH ))"
          setup_artifact_elapsed_seconds="$(( CI_SETUP_ELAPSED_SECONDS + artifact_elapsed_seconds ))"
          printf 'setup_elapsed_seconds=%s\nartifact_elapsed_seconds=%s\nsetup_artifact_elapsed_seconds=%s\nsetup_artifact_budget_seconds=%s\n' \
            "$CI_SETUP_ELAPSED_SECONDS" "$artifact_elapsed_seconds" \
            "$setup_artifact_elapsed_seconds" "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS" \
            > "$CI_ARTIFACT_DIR/artifact-budget.txt"
          (
            cd "$CI_ARTIFACT_DIR"
            find . -type f -print | LC_ALL=C sort | while IFS= read -r file; do
              shasum -a 256 "$file"
            done
          ) > "$checksum_file"
          mv "$checksum_file" "$CI_ARTIFACT_DIR/SHA256SUMS.txt"
          (
            cd "$CI_ARTIFACT_DIR"
            shasum -a 256 -c SHA256SUMS.txt
          )
          test "$setup_artifact_elapsed_seconds" -le "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS"

      - name: Recheck evidence-finalization budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_ARTIFACT_START_EPOCH:-}"
          test -n "${CI_SETUP_ARTIFACT_TIMEOUT_SECONDS:-}"
          test -n "${CI_SETUP_ELAPSED_SECONDS:-}"
          artifact_elapsed_seconds="$(( $(date +%s) - CI_ARTIFACT_START_EPOCH ))"
          setup_artifact_elapsed_seconds="$(( CI_SETUP_ELAPSED_SECONDS + artifact_elapsed_seconds ))"
          test "$setup_artifact_elapsed_seconds" -le "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS"

      - name: Verify selected total budget before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_BUDGET_START_EPOCH:-}"
          test -n "${CI_TOTAL_BUDGET_SECONDS:-}"
          case "$CI_BUDGET_START_EPOCH:$CI_TOTAL_BUDGET_SECONDS" in
            *[!0-9:]*) exit 1 ;;
          esac
          elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
          printf 'elapsed_seconds=%s\ntotal_budget_seconds=%s\n' \
            "$elapsed_seconds" "$CI_TOTAL_BUDGET_SECONDS"
          test "$elapsed_seconds" -le "$CI_TOTAL_BUDGET_SECONDS"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.s10_4_shard_id == 'none' && format('ios-ci-{0}-{1}', github.run_id, github.run_attempt) || format('ios-ci-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.s10_4_shard_id) }}
          path: ${{ runner.temp }}/FieldEvidenceCI
          if-no-files-found: error
          retention-days: 14
