              def baseEvidence($shardID; $taskID): [
                "s10.4-ax-" + $shardID + "-" + $taskID,
                "s10.4-focus-order-" + $shardID + "-" + $taskID,
                "s10.4-target-size-" + $shardID + "-" + $taskID,
                "s10.4-contrast-" + $shardID + "-" + $taskID
              ];
              def exceptionEvidence: {
                exceptionIssueID,
                exceptionOwner,
                exceptionExpiresAt,
                exceptionRationale,
                ignoredAuditIssues
              };
              def expectedExceptionEvidence($matched): {
                exceptionIssueID: ($matched
                  | map(.exceptionIssueID) | join(" | ")),
                exceptionOwner: $matched[0].exceptionOwner,
                exceptionExpiresAt: $matched[0].exceptionExpiresAt,
                exceptionRationale: ($matched
                  | map(.exceptionRationale) | join(" | ")),
                ignoredAuditIssues: ($matched | map(.ignoredAuditIssues[0]))
              };
              def matchedStateAuthorities($row; $authorities; $today):
                ($authorities
                  | map(select(
                      .shardID == $row.shardID
                      and .stateID == $row.stateID
                    ))) as $eligible
                | ($row.ignoredAuditIssues // []) as $observedIssues
                | if ($observedIssues | type) != "array"
                     or ($observedIssues | length) == 0 then
                    error("contrast exception state has no observed issues")
                  else
                    ([$observedIssues[] as $observedIssue
                      | ($eligible
                          | map(select(
                              .ignoredAuditIssues[0] == $observedIssue
                            ))) as $issueMatches
                      | if ($issueMatches | length) != 1 then
                          error("unmatched or ambiguous contrast exception issue")
                        else
                          $issueMatches[0]
                        end
                    ] | sort_by(.exceptionIssueID)) as $matched
                    | if ($matched | map(.exceptionIssueID) | unique | length)
                         != ($matched | length) then
                        error("duplicate contrast exception issue")
                      elif ($observedIssues
                        != ($matched | map(.ignoredAuditIssues[0]))) then
                        error("noncanonical contrast exception issue order")
                      elif ($matched | map(.exceptionOwner) | unique | length) != 1
                           or ($matched | map(.exceptionExpiresAt) | unique | length) != 1 then
                        error("contrast exception owner or expiry is ambiguous")
                      elif any($matched[];
                        (.exceptionExpiresAt
                          | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") | not)
                        or $today > .exceptionExpiresAt) then
                        error("expired or malformed contrast exception authority")
                      elif (($row | exceptionEvidence)
                        != expectedExceptionEvidence($matched)) then
                        error("contrast exception state aggregate drift")
                      else
                        $matched
                      end
                  end;
              def taskIssueLimit($shardID; $taskID):
                if $shardID == "s10.4.current.ax-text"
                   and $taskID == "one_handed_start" then 5
                elif $shardID == "s10.4.current.ax-text"
                     and $taskID == "report_comprehension" then 4
                elif $shardID == "s10.4.current.ax-text"
                     and $taskID == "work_and_recheck" then 6
                elif $shardID == "s10.4.current.default-light"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.default-dark"
                     and $taskID == "report_comprehension" then 2
                elif $shardID == "s10.4.current.default-dark"
                     and $taskID == "history_recovery" then 1
                elif $shardID == "s10.4.current.increased-contrast"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.differentiate-without-color"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.reduce-motion"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.reduce-transparency"
                     and $taskID == "report_comprehension" then 1
                else 0
                end;
              def taskStateLimit($shardID; $taskID):
                if $shardID == "s10.4.current.ax-text"
                   and $taskID == "one_handed_start" then 4
                elif $shardID == "s10.4.current.ax-text"
                     and $taskID == "report_comprehension" then 3
                elif $shardID == "s10.4.current.ax-text"
                     and $taskID == "work_and_recheck" then 6
                elif $shardID == "s10.4.current.default-light"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.default-dark"
                     and $taskID == "report_comprehension" then 2
                elif $shardID == "s10.4.current.default-dark"
                     and $taskID == "history_recovery" then 1
                elif $shardID == "s10.4.current.increased-contrast"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.differentiate-without-color"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.reduce-motion"
                     and $taskID == "report_comprehension" then 1
                elif $shardID == "s10.4.current.reduce-transparency"
                     and $taskID == "report_comprehension" then 1
                else 0
                end;
              ($features | if length == 0 then [] else split(",") end) as $expectedFeatures
              | ($contract[0].tasks | map(.task_id)) as $expectedTasks
              | ($contrasts[0]
                  | map(select(.result == "EXCEPTION"))
                  | sort_by(.stateID)) as $stateExceptions
              | ($exceptions[0]
                  | map(select(.shardID == $shard))
                  | sort_by(.stateID, .exceptionIssueID)) as $shardAuthorities
              | (if ([ $stateExceptions[].stateID ] | unique | length) != ($stateExceptions | length) then
                   error("duplicate contrast exception state")
                 else
                   $stateExceptions
                 end) as $uniqueStateExceptions
              | ($uniqueStateExceptions
                  | map(. as $stateException
                    | matchedStateAuthorities(
                        $stateException;
                        $shardAuthorities;
                        $today
                      ))
                  | (add // [])
                  | sort_by(.stateID, .exceptionIssueID)) as $matchedAuthorities
              | ($matchedAuthorities
                  | map(.stateID) | unique | sort) as $matchedExceptionStateIDs
              | (if ($uniqueStateExceptions | length)
                    != ($matchedExceptionStateIDs | length) then
                   error("contrast exception state-to-issue cardinality drift")
                 elif any($matchedAuthorities | group_by(.stateID)[];
                   length > (
                     if $shard == "s10.4.current.ax-text"
                        and (.[0].stateID == "state.check-preflight.ready"
                          or .[0].stateID == "state.reports-index.ready") then 2
                     else 1
                     end
                   )) then
                   error("contrast exception per-state issue limit exceeded")
                 elif $shard == "s10.4.current.default-light"
                      and (($matchedAuthorities | length) > 1
                        or ($matchedExceptionStateIDs | length) > 1) then
                   error("default-light contrast exception bound exceeded")
                 elif $shard == "s10.4.current.default-dark"
                      and (($matchedAuthorities | length) > 3
                        or ($matchedExceptionStateIDs | length) > 3) then
                   error("default-dark contrast exception bound exceeded")
                 elif $shard == "s10.4.current.increased-contrast"
                     and (($matchedAuthorities | length) > 1
                        or ($matchedExceptionStateIDs | length) > 1) then
                   error("increased-contrast contrast exception bound exceeded")
                 elif $shard == "s10.4.current.differentiate-without-color"
                     and (($matchedAuthorities | length) > 1
                       or ($matchedExceptionStateIDs | length) > 1) then
                   error("differentiate-without-color contrast exception bound exceeded")
                 elif $shard == "s10.4.current.reduce-motion"
                     and (($matchedAuthorities | length) > 1
                       or ($matchedExceptionStateIDs | length) > 1) then
                   error("reduce-motion contrast exception bound exceeded")
                 elif $shard == "s10.4.current.reduce-transparency"
                     and (($matchedAuthorities | length) > 1
                       or ($matchedExceptionStateIDs | length) > 1) then
                   error("reduce-transparency contrast exception bound exceeded")
                elif $shard == "s10.4.current.ax-text"
                     and (($matchedAuthorities | length) > 15
                       or ($matchedExceptionStateIDs | length) > 13) then
                   error("AX-text contrast exception bound exceeded")
                 elif $shard != "s10.4.current.default-light"
                      and $shard != "s10.4.current.default-dark"
                      and $shard != "s10.4.current.increased-contrast"
                      and $shard != "s10.4.current.differentiate-without-color"
                      and $shard != "s10.4.current.ax-text"
                      and $shard != "s10.4.current.reduce-motion"
                      and $shard != "s10.4.current.reduce-transparency"
                      and ($matchedAuthorities | length) != 0 then
                   error("contrast exception on ineligible shard")
                 else
                   $matchedAuthorities
                 end) as $boundedMatchedAuthorities
              | all(.[];
                  . as $row
                  | .taskID as $taskID
                  | ($boundedMatchedAuthorities
                      | map(select(.taskID == $taskID))
                      | sort_by(.stateID, .exceptionIssueID)) as $taskExceptions
                  | ($taskExceptions
                      | map(.stateID) | unique | sort) as $taskExceptionStateIDs
                  | ($taskExceptions | map(.exceptionOwner) | unique) as $exceptionOwners
                  | ($taskExceptions | map(.exceptionExpiresAt) | unique) as $exceptionExpiries
                  | type == "object"
                  and ((keys | sort) == ([
                    "taskID", "shardID", "deviceProfileID", "feature",
                    "automatedStatus", "automatedReviewer", "evidenceID",
                    "focusOrderEvidenceID", "targetSizeEvidenceID", "contrastEvidenceID",
                    "automatedEvidenceIDs", "exceptionIssueID", "exceptionOwner",
                    "exceptionExpiresAt", "exceptionRationale", "exceptionStateIDs",
                    "rationale", "aggregateAXTreeSHA256", "stateCount", "stateSetSHA256",
                    "stateAXTreeDigests"
                  ] | sort))
                  and (.taskID | type == "string" and IN($expectedTasks[]))
                  and (.shardID == $shard)
                  and (.deviceProfileID == $profile)
                  and (.feature | type == "string" and IN($expectedFeatures[]))
                  and (.automatedReviewer == "FieldEvidenceAppUITests/S10_4AutomatedBrandLabUITests")
                  and (.evidenceID == ("s10.4-ax-" + $shard + "-" + $taskID))
                  and (.focusOrderEvidenceID == ("s10.4-focus-order-" + $shard + "-" + $taskID))
                  and (.targetSizeEvidenceID == ("s10.4-target-size-" + $shard + "-" + $taskID))
                  and (.contrastEvidenceID == ("s10.4-contrast-" + $shard + "-" + $taskID))
                  and (.aggregateAXTreeSHA256 | type == "string" and test("^[0-9A-F]{64}$"))
                  and (.stateCount | type == "number" and . > 0)
                  and (($taskExceptions | length)
                    <= taskIssueLimit($shard; $taskID))
                  and (($taskExceptionStateIDs | length)
                    <= taskStateLimit($shard; $taskID))
                  and (
                    if ($taskExceptions | length) > 0 then
                      (.automatedStatus == "EXCEPTION")
                      and (.automatedEvidenceIDs == (
                        baseEvidence($shard; $taskID)
                        + ($taskExceptionStateIDs | map(
                            "s10.4-contrast-" + $shard + "-" + .
                          ))
                      ))
                      and (.exceptionIssueID == ($taskExceptions
                        | map(.exceptionIssueID) | join(" | ")))
                      and ($exceptionOwners | length) == 1
                      and (.exceptionOwner == $exceptionOwners[0])
                      and ($exceptionExpiries | length) == 1
                      and (.exceptionExpiresAt == $exceptionExpiries[0])
                      and ($today <= .exceptionExpiresAt)
                      and (.exceptionRationale == ($taskExceptions
                        | map(.exceptionRationale) | join(" | ")))
                      and (.exceptionStateIDs == $taskExceptionStateIDs)
                      and (.rationale == (
                        if ($taskExceptions | length) == 1 then
                          "All task states produced AX-tree, focus-order, and target-size evidence; the sole Apple contrast issue is bound to the named, expiring exception."
                        else
                          "All task states produced AX-tree, focus-order, and target-size evidence; the exact Apple contrast issues are bound to the named, expiring exceptions."
                        end
                      ))
                      and all($taskExceptionStateIDs[];
                        . as $exceptionStateID
                        | ($row.stateAXTreeDigests | map(.stateID)
                          | index($exceptionStateID)) != null
                      )
                    else
                      (.automatedStatus == "PASS")
                      and (.automatedEvidenceIDs == baseEvidence($shard; $taskID))
                      and (.exceptionIssueID == "")
                      and (.exceptionOwner == "")
                      and (.exceptionExpiresAt == "")
                      and (.exceptionRationale == "")
                      and (.exceptionStateIDs == [])
                      and (.rationale == "All task states produced AX-tree, focus-order, target-size, and strict Apple contrast evidence.")
                    end
                  )
                )
                and ([.[] | [.taskID, .deviceProfileID, .feature] | join("|")] as $keys
                  | ($keys | unique | length) == ($keys | length))
                and ([.[] | .taskID] | unique | sort) ==
                  (if ($expectedFeatures | length) == 0 then [] else ($expectedTasks | sort) end)
                and ([.[] | .feature] | unique | sort) == ($expectedFeatures | sort)
            ' "$shard_evidence_path/accessibility.json" > /dev/null

          while IFS= read -r task_row; do
            task_id="$(jq -r '.taskID' <<< "$task_row")"
            case "$task_id" in
              ''|*[!a-z0-9_]*) exit 1 ;;
            esac
            jq -cS --arg productHead "$GITHUB_SHA" \
              '. + {sourceProductHead: $productHead}' \
              <<< "$task_row" \
              > "$task_accessibility_path/$task_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/accessibility.json")
          test "$(find "$task_accessibility_path" -type f -name '*.json' | wc -l | tr -d ' ')" \
            -eq "$expected_accessibility_rows"

          sed -n 's/^S10_4_AX_STATE //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$shard_evidence_path/state-ax.ndjson"
          jq -s '.' "$shard_evidence_path/state-ax.ndjson" \
            > "$shard_evidence_path/state-ax.json"
          test "$(jq 'length' "$shard_evidence_path/state-ax.json")" -eq 67
          jq -e \
            --arg shard "$CI_S10_4_SHARD_ID" \
            --arg requirement "$CI_S10_4_REQUIREMENT_ID" \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" \
            --slurpfile inventory docs/design/s10/s10-screen-state-inventory.json '
              ($inventory[0] | [.routes[].states[].state_id] | sort) as $expectedStates
              | all(.[];
                  type == "object"
                  and (.stateID | type == "string" and IN($expectedStates[]))
                  and (.shardID == $shard)
                  and (.requirementID == $requirement)
                  and (.deviceProfileID == $profile)
                  and (.result == "PASS")
                  and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .stateID))
                  and (.axTreeSHA256 | type == "string" and test("^[0-9A-F]{64}$"))
                  and (.capture == "XCUIApplication.debugDescription")
                )
                and ([.[].stateID] | unique | length == 67)
                and ([.[].stateID] | sort) == $expectedStates
            ' "$shard_evidence_path/state-ax.json" > /dev/null

          while IFS= read -r state_ax_row; do
            state_id="$(jq -r '.stateID' <<< "$state_ax_row")"
            case "$state_id" in state.*) ;; *) exit 1 ;; esac
            jq -cS --arg productHead "$GITHUB_SHA" \
              '. + {sourceProductHead: $productHead}' \
              <<< "$state_ax_row" \
              > "$state_ax_path/$state_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/state-ax.json")
          test "$(find "$state_ax_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67

          jq -e \
            --arg shard "$CI_S10_4_SHARD_ID" \
            --arg requirement "$CI_S10_4_REQUIREMENT_ID" \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" \
            --arg today "$(date -u +%F)" \
            --slurpfile inventory docs/design/s10/s10-screen-state-inventory.json \
            --slurpfile exceptions "$contrast_exception_authority_path" '
              def exceptionEvidence: {
                exceptionIssueID,
                exceptionOwner,
                exceptionExpiresAt,
                exceptionRationale,
                ignoredAuditIssues
              };
              def expectedExceptionEvidence($matched): {
                exceptionIssueID: ($matched
                  | map(.exceptionIssueID) | join(" | ")),
                exceptionOwner: $matched[0].exceptionOwner,
                exceptionExpiresAt: $matched[0].exceptionExpiresAt,
                exceptionRationale: ($matched
                  | map(.exceptionRationale) | join(" | ")),
                ignoredAuditIssues: ($matched | map(.ignoredAuditIssues[0]))
              };
              def matchedStateAuthorities($row; $authorities; $today):
                ($authorities
                  | map(select(
                      .shardID == $row.shardID
                      and .stateID == $row.stateID
                    ))) as $eligible
                | ($row.ignoredAuditIssues // []) as $observedIssues
                | if ($observedIssues | type) != "array"
                     or ($observedIssues | length) == 0 then
                    error("contrast exception state has no observed issues")
                  else
                    ([$observedIssues[] as $observedIssue
                      | ($eligible
                          | map(select(
                              .ignoredAuditIssues[0] == $observedIssue
                            ))) as $issueMatches
                      | if ($issueMatches | length) != 1 then
                          error("unmatched or ambiguous contrast exception issue")
                        else
                          $issueMatches[0]
                        end
                    ] | sort_by(.exceptionIssueID)) as $matched
                    | if ($matched | map(.exceptionIssueID) | unique | length)
                         != ($matched | length) then
                        error("duplicate contrast exception issue")
                      elif ($observedIssues
                        != ($matched | map(.ignoredAuditIssues[0]))) then
                        error("noncanonical contrast exception issue order")
                      elif ($matched | map(.exceptionOwner) | unique | length) != 1
                           or ($matched | map(.exceptionExpiresAt) | unique | length) != 1 then
                        error("contrast exception owner or expiry is ambiguous")
                      elif any($matched[];
                        (.exceptionExpiresAt
                          | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") | not)
                        or $today > .exceptionExpiresAt) then
                        error("expired or malformed contrast exception authority")
                      elif (($row | exceptionEvidence)
                        != expectedExceptionEvidence($matched)) then
                        error("contrast exception state aggregate drift")
                      else
                        $matched
                      end
                  end;
              def stateIssueLimit($shardID; $stateID):
                if $shardID == "s10.4.current.ax-text"
                   and $stateID == "state.check-preflight.ready" then 2
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.issue.open" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.new-sign.editing" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.paywall.purchase-complete" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.report-correction.validation-error" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.issue.recheck-due" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.issue.resolved" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.recheck-capture.wide-ready" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.report-history.ready" then 1
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.reports-index.ready" then 2
                elif $shardID == "s10.4.current.ax-text"
                     and $stateID == "state.work.validation-error" then 1
                elif $shardID == "s10.4.current.default-light"
                     and $stateID == "state.report-correction.validation-error" then 1
                elif $shardID == "s10.4.current.default-dark"
                     and ($stateID == "state.feedback.review-ready"
                       or $stateID == "state.report-correction.validation-error"
                       or $stateID == "state.sample-report.ready") then 1
                elif $shardID == "s10.4.current.increased-contrast"
                     and $stateID == "state.report-correction.validation-error" then 1
                elif $shardID == "s10.4.current.differentiate-without-color"
                     and $stateID == "state.report-correction.validation-error" then 1
                elif $shardID == "s10.4.current.reduce-motion"
                     and $stateID == "state.report-correction.validation-error" then 1
                elif $shardID == "s10.4.current.reduce-transparency"
                     and $stateID == "state.report-correction.validation-error" then 1
                else 0
                end;
              ($inventory[0] | [.routes[].states[].state_id] | sort) as $expectedStates
              | all(.[];
                  . as $row
                  | type == "object"
                  and ((keys | sort) == ([
                    "shardID", "stateID", "requirementID", "deviceProfileID",
                    "result", "evidenceID", "axTreeSHA256", "audit",
                    "exceptionIssueID", "exceptionOwner", "exceptionExpiresAt",
                    "exceptionRationale", "ignoredAuditIssues"
                  ] | sort))
                  and (.stateID | type == "string" and IN($expectedStates[]))
                  and (.shardID == $shard)
                  and (.requirementID == $requirement)
                  and (.deviceProfileID == $profile)
                  and (.evidenceID == ("s10.4-contrast-" + $shard + "-" + .stateID))
                  and (.axTreeSHA256 | type == "string" and test("^[0-9A-F]{64}$"))
                  and (.audit == "XCUIAccessibilityAuditType.contrast")
                  and (
                    if .result == "PASS" then
                      ((. | exceptionEvidence) == {
                        exceptionIssueID: "",
                        exceptionOwner: "",
                        exceptionExpiresAt: "",
                        exceptionRationale: "",
                        ignoredAuditIssues: []
                      })
                    elif .result == "EXCEPTION" then
                      matchedStateAuthorities($row; $exceptions[0]; $today) as $matched
                      | ($matched | length) > 0
                      and (($matched | length)
                        <= stateIssueLimit($row.shardID; $row.stateID))
                    else
                      false
                    end
                  )
                )
                and ([.[].stateID] | unique | length == 67)
                and ([.[].stateID] | sort) == $expectedStates
                and (
                  ([.[] | select(.result == "EXCEPTION")]
                    | sort_by(.stateID)) as $stateExceptions
                  | ($stateExceptions
                      | map(. as $stateException
                        | matchedStateAuthorities(
                            $stateException;
                            $exceptions[0];
                            $today
                          ))
                      | (add // [])
                      | sort_by(.stateID, .exceptionIssueID)) as $matchedAuthorities
                  | ($matchedAuthorities
                      | map(.stateID) | unique | sort) as $matchedExceptionStateIDs
                  | ($stateExceptions | length) == ($matchedExceptionStateIDs | length)
                    and all($matchedAuthorities | group_by(.stateID)[];
                      length <= stateIssueLimit($shard; .[0].stateID))
                    and (
                      if $shard == "s10.4.current.default-light" then
                        ($matchedAuthorities | length) <= 1
                        and ($matchedExceptionStateIDs | length) <= 1
                      elif $shard == "s10.4.current.default-dark" then
                        ($matchedAuthorities | length) <= 3
                        and ($matchedExceptionStateIDs | length) <= 3
                      elif $shard == "s10.4.current.increased-contrast" then
                        ($matchedAuthorities | length) <= 1
                        and ($matchedExceptionStateIDs | length) <= 1
                      elif $shard == "s10.4.current.differentiate-without-color" then
                        ($matchedAuthorities | length) <= 1
                        and ($matchedExceptionStateIDs | length) <= 1
                      elif $shard == "s10.4.current.reduce-motion" then
                        ($matchedAuthorities | length) <= 1
                        and ($matchedExceptionStateIDs | length) <= 1
                      elif $shard == "s10.4.current.reduce-transparency" then
                        ($matchedAuthorities | length) <= 1
                        and ($matchedExceptionStateIDs | length) <= 1
                      elif $shard == "s10.4.current.ax-text" then
                        ($matchedAuthorities | length) <= 15
                        and ($matchedExceptionStateIDs | length) <= 13
                      else
                        ($matchedAuthorities | length) == 0
                        and ($matchedExceptionStateIDs | length) == 0
                      end
                    )
                )
            ' "$shard_evidence_path/contrast.json" > /dev/null

          while IFS= read -r contrast_row; do
            state_id="$(jq -r '.stateID' <<< "$contrast_row")"
            case "$state_id" in state.*) ;; *) exit 1 ;; esac
            jq -cS --arg productHead "$GITHUB_SHA" \
              '. + {sourceProductHead: $productHead}' \
              <<< "$contrast_row" \
              > "$state_contrast_path/$state_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/contrast.json")
          test "$(find "$state_contrast_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67

          jq -n \
            --arg taskID "$CI_TASK_ID" \
            --arg shardID "$CI_S10_4_SHARD_ID" \
            --arg requirementID "$CI_S10_4_REQUIREMENT_ID" \
            --arg deviceProfileID "$CI_S10_4_DEVICE_PROFILE_ID" \
            --arg runtime "$SIMULATOR_RUNTIME" \
            --arg runtimeBuild "$SIMULATOR_RUNTIME_BUILD" \
            --arg simulatorName "$SIMULATOR_NAME" \
            --arg productHead "$GITHUB_SHA" \
            --argjson candidateCount 67 \
            --argjson stateAXRowCount 67 \
            --argjson accessibilityRowCount "$expected_accessibility_rows" \
            --argjson contrastRowCount 67 '
              {
                schemaVersion: 1,
                taskID: $taskID,
                shardID: $shardID,
                requirementID: $requirementID,
                deviceProfileID: $deviceProfileID,
                runtime: $runtime,
                runtimeBuild: $runtimeBuild,
                simulatorName: $simulatorName,
                productHead: $productHead,
                candidateCount: $candidateCount,
                stateAXRowCount: $stateAXRowCount,
                accessibilityRowCount: $accessibilityRowCount,
                contrastRowCount: $contrastRowCount
              }
            ' > "$shard_evidence_path/shard-receipt.json"

      - name: Begin evidence-finalization budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CI_ARTIFACT_START_EPOCH="$(date +%s)"
          printf 'CI_ARTIFACT_START_EPOCH=%s\n' "$CI_ARTIFACT_START_EPOCH" >> "$GITHUB_ENV"

      - name: Validate required build and test evidence
        if: ${{ always() && inputs.runner_provider != 'bitrise' }}
        shell: bash
        run: |
          set -euo pipefail

          require_nonempty_directory() {
            test -d "$1"
            test -n "$(find "$1" -mindepth 1 -print -quit)"
          }

          verify_executed_selectors() {
            local result_bundle="$1"
            local selectors_key="$2"
            local bundle_type="$3"
            local output_stem="$4"
            local test_results="$CI_ARTIFACT_DIR/${output_stem}-test-results.json"
            local executed_tests="$CI_ARTIFACT_DIR/${output_stem}-executed-tests.json"

            xcrun xcresulttool get test-results tests \
              --path "$result_bundle" --compact > "$test_results"
            test -s "$test_results"

            jq --arg bundleType "$bundle_type" '
              def normalize_identifier:
                sub("\\(\\)$"; "");
              def executed_cases($bundleName; $bundleType):
                . as $node
                | (
                    if $node.nodeType? == $bundleType
                    then ($node.name? // "")
                    else $bundleName
                    end
                  ) as $nextBundle
                | if (
                    $node.nodeType? == "Test Case"
                    and ($nextBundle | type == "string" and length > 0)
                    and ($node.nodeIdentifier? | type == "string" and length > 0)
                    and (
                      ($node.result? == "Passed")
                      or ($node.result? == "Failed")
                      or ($node.result? == "Expected Failure")
                    )
                  )
                  then
                    ($node.nodeIdentifier | normalize_identifier) as $identifier
                    | {
                        identifier: (
                          if ($identifier | startswith($nextBundle + "/"))
                          then $identifier
                          else ($nextBundle + "/" + $identifier)
                          end
                        ),
                        result: $node.result
                      }
                  else
                    ($node.children[]? | executed_cases($nextBundle; $bundleType))
                  end;
              [
                .testNodes[]?
                | executed_cases(null; $bundleType)
              ]
              | sort_by(.identifier)
              | unique_by(.identifier)
            ' "$test_results" > "$executed_tests"
            test -s "$executed_tests"

            jq -e --arg key "$selectors_key" --slurpfile executed "$executed_tests" '
              def normalize_identifier:
                sub("\\(\\)$"; "");
              .[$key] as $selectors
              | ($executed[0] // []) as $actual
              | (($actual | type) == "array" and ($actual | length) > 0)
                and all(
                  $selectors[];
                  . as $selector
                  | ($selector | normalize_identifier) as $wanted
                  | any(
                      $actual[];
                      (.identifier | normalize_identifier) as $observed
                      | ($observed == $wanted)
                        or ($observed | startswith($wanted + "/"))
                    )
                )
            ' Scripts/ci-selection.json > /dev/null
          }

          test -s "$CI_ARTIFACT_DIR/simulator-boot-start.log"
          test -s "$CI_ARTIFACT_DIR/simulator-boot.log"
          test -s "$CI_ARTIFACT_DIR/runner-provider.txt"
          test -s "$CI_ARTIFACT_DIR/build-smoke.log"
          test -s "$CI_ARTIFACT_DIR/test-smoke.log"
          require_nonempty_directory "$CI_ARTIFACT_DIR/Build.xcresult"
          require_nonempty_directory "$CI_ARTIFACT_DIR/UnitTests.xcresult"
          verify_executed_selectors \
            "$CI_ARTIFACT_DIR/UnitTests.xcresult" \
            unitTestSelectors "Unit test bundle" unit

          if test "${CI_RUN_UI_SMOKE:-}" = "true"; then
            test -s "$CI_ARTIFACT_DIR/ui-smoke.log"
            require_nonempty_directory "$CI_ARTIFACT_DIR/UISmoke.xcresult"
            test -s "$CI_ARTIFACT_DIR/ui-final.png"
            verify_executed_selectors \
              "$CI_ARTIFACT_DIR/UISmoke.xcresult" \
              uiTestSelectors "UI test bundle" ui
            if test "${CI_TASK_ID:-}" = "S10.4"; then
              test -s "$CI_ARTIFACT_DIR/simulator-runtime-policy.txt"
              test "${CI_S10_4_SHARD_ID:-none}" != "none"
              shard_evidence_path="$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID"
              if test "${CI_S10_4_SEGMENT_ID:-none}" != "none"; then
                segment_json="$(jq -cer --arg segment "$CI_S10_4_SEGMENT_ID" \
                  '.segments[] | select(.segmentID == $segment)' \
                  Scripts/s10-4-segment-plan.json)"
                expected_state_count="$(jq -r '.stateCount' <<< "$segment_json")"
                expected_replay_count="$(jq -r '.replayCount' <<< "$segment_json")"
                expected_resume_setup_count="$(jq -r '.resumeSetup.rowCount // 0' <<< "$segment_json")"
                expected_plan_sha256="$(shasum -a 256 Scripts/s10-4-segment-plan.json | awk '{print toupper($1)}')"
                expected_evidence_kernel_sha256="$(jq -r '.evidenceKernelSHA256' Scripts/s10-4-segment-plan.json)"
                expected_selector_sha256="$(shasum -a 256 Scripts/ci-selection.json | awk '{print toupper($1)}')"
                expected_shard_contract_sha256="$(shasum -a 256 Scripts/s10-4-shards.json | awk '{print toupper($1)}')"
                expected_inventory_sha256="$(shasum -a 256 docs/design/s10/s10-screen-state-inventory.json | awk '{print toupper($1)}')"
                expected_common_task_schema_sha256="$(shasum -a 256 docs/design/s10/s10-accessibility-common-tasks.json | awk '{print toupper($1)}')"
                expected_unit_executed_test_selectors="$(jq -c '
                  [.. | objects
                    | select(.nodeType? == "Test Case" and .result? == "Passed")
                    | .nodeIdentifier]
                  | unique | sort
                ' "$CI_ARTIFACT_DIR/unit-test-results.json")"
                expected_ui_executed_test_selectors="$(jq -c '
                  [.. | objects
                    | select(.nodeType? == "Test Case" and .result? == "Passed")
                    | .nodeIdentifier]
                  | unique | sort
                ' "$CI_ARTIFACT_DIR/ui-test-results.json")"
                expected_attachment_count="$(jq '[.[]?.attachments[]?] | length' \
                  "$shard_evidence_path/xcresult-attachment-manifest.json")"
                test "$expected_attachment_count" -eq "$((expected_state_count + 1))"
                require_nonempty_directory "$shard_evidence_path/candidates"
                test "$(find "$shard_evidence_path/candidates" -type f -name 'state.*.png' \
                  | wc -l | tr -d ' ')" -eq "$expected_state_count"
                test -s "$shard_evidence_path/xcresult-attachment-manifest.json"
                test -s "$shard_evidence_path/candidate-exports.json"
                test -s "$shard_evidence_path/candidate-files.json"
                test -s "$shard_evidence_path/state-ax.ndjson"
                test -s "$shard_evidence_path/state-ax.json"
                test -s "$shard_evidence_path/contrast.ndjson"
                test -s "$shard_evidence_path/contrast.json"
                test -s "$shard_evidence_path/replay-rows.json"
                test -s "$shard_evidence_path/resume-setup-rows.json"
                test -s "$shard_evidence_path/segment-receipt.pending.json"
                test ! -e "$shard_evidence_path/segment-receipt.json"
                test ! -e "$shard_evidence_path/shard-receipt.json"
                test "$(jq 'length' "$shard_evidence_path/candidate-files.json")" \
                  -eq "$expected_state_count"
                test "$(jq 'length' "$shard_evidence_path/state-ax.json")" \
                  -eq "$expected_state_count"
                test "$(jq 'length' "$shard_evidence_path/contrast.json")" \
                  -eq "$expected_state_count"
                test "$(jq 'length' "$shard_evidence_path/replay-rows.json")" \
                  -eq "$expected_replay_count"
                test "$(jq 'length' "$shard_evidence_path/resume-setup-rows.json")" \
                  -eq "$expected_resume_setup_count"
                state_ax_path="$CI_ARTIFACT_DIR/ax/$CI_S10_4_SHARD_ID"
                state_contrast_path="$CI_ARTIFACT_DIR/contrast/$CI_S10_4_SHARD_ID"
                require_nonempty_directory "$state_ax_path"
                require_nonempty_directory "$state_contrast_path"
                test "$(find "$state_ax_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" \
                  -eq "$expected_state_count"
                test "$(find "$state_contrast_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" \
                  -eq "$expected_state_count"
                test ! -e "$CI_ARTIFACT_DIR/accessibility/$CI_S10_4_SHARD_ID"
                jq -e --arg segment "$CI_S10_4_SEGMENT_ID" \
                  --arg head "$GITHUB_SHA" \
                  --arg ref "$GITHUB_REF" \
                  --arg run "$GITHUB_RUN_ID" \
                  --arg job "$GITHUB_JOB" \
                  --arg artifactName "ios-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_S10_4_SHARD_ID-$CI_S10_4_SEGMENT_ID" \
                  --arg planSHA256 "$expected_plan_sha256" \
                  --arg evidenceKernelSHA256 "$expected_evidence_kernel_sha256" \
                  --arg selectorSHA256 "$expected_selector_sha256" \
                  --arg shardContractSHA256 "$expected_shard_contract_sha256" \
                  --arg inventorySHA256 "$expected_inventory_sha256" \
                  --arg commonTaskSchemaSHA256 "$expected_common_task_schema_sha256" \
                  --argjson unitTestSelectors "$expected_unit_executed_test_selectors" \
                  --argjson uiTestSelectors "$expected_ui_executed_test_selectors" \
                  --argjson attachmentCount "$expected_attachment_count" \
                  --argjson segmentPlan "$segment_json" \
                  --argjson stateCount "$expected_state_count" \
                  --argjson replayCount "$expected_replay_count" \
                  --argjson resumeSetupRowCount "$expected_resume_setup_count" '
                    .schemaVersion == 1
                    and .receiptKind == "s10.4-segment-pending"
                    and .complete == false
                    and .finalAcceptanceEligible == false
                    and .segmentID == $segment
                    and .productHead == $head
                    and .ref == $ref
                    and .runID == $run
                    and .jobID == $job
                    and .artifactName == $artifactName
                    and .segmentPlanSHA256 == $planSHA256
                    and .evidenceKernelSHA256 == $evidenceKernelSHA256
                    and .selectorSHA256 == $selectorSHA256
                    and .shardContractSHA256 == $shardContractSHA256
                    and .inventorySHA256 == $inventorySHA256
                    and .commonTaskSchemaSHA256 == $commonTaskSchemaSHA256
                    and .sdkName == "iphonesimulator26.5"
                    and .sdkBuild == "23F81a"
                    and .xcodeVersion == "Xcode 26.6"
                    and .xcodeBuild == "17F113"
                    and .runnerProvider == "github"
                    and .runnerLabel == "macos-26"
                    and .simulatorRuntime == "iOS 26.2"
                    and .simulatorRuntimeBuild == "23C54"
                    and .simulatorName == "iPhone 17"
                    and .buildMode == "independent-build-for-testing"
                    and .crossSessionBuildReuse == false
                    and .crossSessionTestWithoutBuilding == false
                    and .unitExecutedTestCount == 5
                    and .uiExecutedTestCount == 1
                    and .unitTestSelectors == $unitTestSelectors
                    and (.unitTestSelectors | length) == 5
                    and .uiTestSelectors == $uiTestSelectors
                    and (.uiTestSelectors | length) == 1
                    and .attachmentCount == $attachmentCount
                    and .segmentTerminalAttachmentCount == 1
                    and .ordinal == $segmentPlan.ordinal
                    and .startOrdinal == $segmentPlan.startOrdinal
                    and .endOrdinal == $segmentPlan.endOrdinal
                    and .resumeMode == $segmentPlan.resumeMode
                    and .dependencySegmentIDs == $segmentPlan.dependencySegmentIDs
                    and .dependencyOwnedStateCount == $segmentPlan.dependencyOwnedStateCount
                    and .dependencyOwnedStateIDs == $segmentPlan.dependencyOwnedStateIDs
                    and .dependencyOwnedStateSHA256 == $segmentPlan.dependencyOwnedStateSHA256
                    and .resumeSetup == $segmentPlan.resumeSetup
                    and .ownedStateIDs == $segmentPlan.ownedStateIDs
                    and .replayStateIDs == $segmentPlan.replayStateIDs
                    and .ownedStateSHA256 == $segmentPlan.ownedStateSHA256
                    and .replayStateSHA256 == $segmentPlan.replayStateSHA256
                    and .stateCount == $stateCount
                    and .replayCount == $replayCount
                    and .markerCount == $stateCount
                    and .replayRowCount == $replayCount
                    and .resumeSetupRowCount == $resumeSetupRowCount
                    and .diagnosticCount == 0
                    and .candidateCount == $stateCount
                    and .stateAXRowCount == $stateCount
                    and .contrastRowCount == $stateCount
                    and .accessibilityRowCount == 0
                    and (.buildIdentitySHA256 | test("^[0-9A-F]{64}$"))
                    and (.unitIdentitySHA256 | test("^[0-9A-F]{64}$"))
                    and (.uiIdentitySHA256 | test("^[0-9A-F]{64}$"))
                    and (.sessionIdentitySHA256 | test("^[0-9A-F]{64}$"))
                  ' "$shard_evidence_path/segment-receipt.pending.json" > /dev/null
                for evidence_file in "$state_ax_path"/*.json; do
                  jq -e --arg shard "$CI_S10_4_SHARD_ID" --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .stateID))
                    and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                  ' "$evidence_file" > /dev/null
                done
                for evidence_file in "$state_contrast_path"/*.json; do
                  jq -e --arg shard "$CI_S10_4_SHARD_ID" --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-contrast-" + $shard + "-" + .stateID))
                    and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                  ' "$evidence_file" > /dev/null
                done
              else
              require_nonempty_directory "$shard_evidence_path/candidates"
              test "$(find "$shard_evidence_path/candidates" -type f -name 'state.*.png' \
                | wc -l | tr -d ' ')" -eq 67
              test -s "$shard_evidence_path/xcresult-attachment-manifest.json"
              test -s "$shard_evidence_path/candidate-exports.json"
              test -s "$shard_evidence_path/candidate-files.json"
              test -s "$shard_evidence_path/accessibility.ndjson"
              test -s "$shard_evidence_path/accessibility.json"
              test -s "$shard_evidence_path/contrast.ndjson"
              test -s "$shard_evidence_path/contrast.json"
              test -s "$shard_evidence_path/shard-receipt.json"
              test "$(jq 'length' "$shard_evidence_path/candidate-files.json")" -eq 67
              test "$(jq 'length' "$shard_evidence_path/accessibility.json")" -eq 6
              test "$(jq 'length' "$shard_evidence_path/contrast.json")" -eq 67
              state_ax_path="$CI_ARTIFACT_DIR/ax/$CI_S10_4_SHARD_ID"
              state_contrast_path="$CI_ARTIFACT_DIR/contrast/$CI_S10_4_SHARD_ID"
              task_accessibility_path="$CI_ARTIFACT_DIR/accessibility/$CI_S10_4_SHARD_ID"
              require_nonempty_directory "$state_ax_path"
              require_nonempty_directory "$state_contrast_path"
              require_nonempty_directory "$task_accessibility_path"
              test "$(find "$state_ax_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67
              test "$(find "$state_contrast_path" -type f -name 'state.*.json' | wc -l | tr -d ' ')" -eq 67
              test "$(find "$task_accessibility_path" -type f -name '*.json' | wc -l | tr -d ' ')" -eq 6

              jq -r '.routes[].states[].state_id + ".json"' \
                docs/design/s10/s10-screen-state-inventory.json \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-expected-state-evidence-files.txt"
              find "$state_ax_path" -type f -name 'state.*.json' -exec basename {} \; \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-observed-ax-files.txt"
              find "$state_contrast_path" -type f -name 'state.*.json' -exec basename {} \; \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-observed-contrast-files.txt"
              cmp -s "$RUNNER_TEMP/s10-4-expected-state-evidence-files.txt" \
                "$RUNNER_TEMP/s10-4-observed-ax-files.txt"
              cmp -s "$RUNNER_TEMP/s10-4-expected-state-evidence-files.txt" \
                "$RUNNER_TEMP/s10-4-observed-contrast-files.txt"

              jq -r '.tasks[].task_id + ".json"' \
                docs/design/s10/s10-accessibility-common-tasks.json \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-expected-task-evidence-files.txt"
              find "$task_accessibility_path" -type f -name '*.json' -exec basename {} \; \
                | LC_ALL=C sort > "$RUNNER_TEMP/s10-4-observed-task-evidence-files.txt"
              cmp -s "$RUNNER_TEMP/s10-4-expected-task-evidence-files.txt" \
                "$RUNNER_TEMP/s10-4-observed-task-evidence-files.txt"

              for evidence_file in "$state_ax_path"/*.json; do
                jq -e \
                  --arg shard "$CI_S10_4_SHARD_ID" \
                  --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .stateID))
                    and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                  ' "$evidence_file" > /dev/null
              done
              for evidence_file in "$state_contrast_path"/*.json; do
                jq -e \
                  --arg shard "$CI_S10_4_SHARD_ID" \
                  --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-contrast-" + $shard + "-" + .stateID))
                    and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                  ' "$evidence_file" > /dev/null
              done
              for evidence_file in "$task_accessibility_path"/*.json; do
                jq -e \
                  --arg shard "$CI_S10_4_SHARD_ID" \
                  --arg productHead "$GITHUB_SHA" '
                    .shardID == $shard
                    and .sourceProductHead == $productHead
                    and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .taskID))
                    and (.focusOrderEvidenceID == ("s10.4-focus-order-" + $shard + "-" + .taskID))
                    and (.targetSizeEvidenceID == ("s10.4-target-size-" + $shard + "-" + .taskID))
                    and (.contrastEvidenceID == ("s10.4-contrast-" + $shard + "-" + .taskID))
                  ' "$evidence_file" > /dev/null
              done
              fi
            fi
          else
            test "${CI_RUN_UI_SMOKE:-}" = "false"
            test ! -e "$CI_ARTIFACT_DIR/ui-smoke.log"
            test ! -e "$CI_ARTIFACT_DIR/UISmoke.xcresult"
            test ! -e "$CI_ARTIFACT_DIR/ui-final.png"
          fi

      - name: Validate Bitrise development-only segment evidence
        if: ${{ always() && inputs.runner_provider == 'bitrise' }}
        shell: bash
        run: |
          set -euo pipefail
          require_nonempty_directory() {
            test -d "$1"
            test -n "$(find "$1" -mindepth 1 -print -quit)"
          }
          development_path="$CI_ARTIFACT_DIR/bitrise-development/$CI_S10_4_SEGMENT_ID"
          test "$CI_RUNNER_PROVIDER:$CI_RUNNER_LABEL" = "bitrise:bitrise-m4-pro"
          test "$CI_S10_4_SHARD_ID" = "s10.4.current.ax-text"
          case "$CI_S10_4_SEGMENT_ID" in segment-1 | segment-2 | segment-3) ;; *) exit 1 ;; esac
          test -s "$CI_ARTIFACT_DIR/runner-provider.txt"
          test -s "$CI_ARTIFACT_DIR/github-run.txt"
          test -s "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log"
          test -s "$CI_ARTIFACT_DIR/bitrise-build-cache-wrapper-paths.txt"
          test -s "$CI_ARTIFACT_DIR/bitrise-build-cache-cli-verification.txt"
          test -s "$CI_ARTIFACT_DIR/build-smoke.log"
          test -s "$CI_ARTIFACT_DIR/test-smoke.log"
          test -s "$CI_ARTIFACT_DIR/ui-smoke.log"
          require_nonempty_directory "$CI_ARTIFACT_DIR/Build.xcresult"
          require_nonempty_directory "$CI_ARTIFACT_DIR/UnitTests.xcresult"
          require_nonempty_directory "$CI_ARTIFACT_DIR/UISmoke.xcresult"
          test -s "$development_path/development-segment-record.json"
          test -s "$CI_ARTIFACT_DIR/s10-4-segment-plan-source-sha256.txt"
          test -s "$CI_ARTIFACT_DIR/s10-4-segment-plan-development-binding-redacted.json"
          test ! -e "$CI_ARTIFACT_DIR/s10-4-segment-plan.json"
          test ! -e "$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID/segment-receipt.json"
          test ! -e "$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID/segment-receipt.pending.json"
          test ! -e "$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID/shard-receipt.json"
          activation_count="$(cat "$RUNNER_TEMP/bitrise-build-cache-activation-counter.txt")"
          test "$activation_count" -ge 6
          test "$(grep -c '^benchmark_phase=established$' "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log")" \
            -eq "$activation_count"
          if grep -F 'cache disabled, analytics only' \
            "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log" > /dev/null; then
            exit 1
          fi
          jq -e '
            .laneID == "bitrise-build-hub-xcode-26.6-segmented-development-only"
            and .provider == "bitrise"
            and .runnerLabel == "bitrise-m4-pro"
            and .benchmarkPhase == "established"
            and .cacheOperational == true
            and .acceptingSegmentReceipt == false
            and .feedsAcceptanceAssembler == false
            and .rawEvidenceOnly == true
            and .finalAcceptanceEligible == false
          ' "$development_path/development-segment-record.json" > /dev/null
          jq -e '
            .executionLane == "bitrise-build-hub-xcode-26.6-segmented-development-only"
            and .runnerProvider == "bitrise"
            and .runnerLabel == "bitrise-m4-pro"
            and .workspaceID == "[REDACTED]"
            and .feedsAcceptanceAssembler == false
            and .finalAcceptanceEligible == false
          ' "$CI_ARTIFACT_DIR/s10-4-segment-plan-development-binding-redacted.json" > /dev/null

      - name: Finalize successful S10.4 segment receipt
        if: ${{ success() && inputs.runner_provider == 'github' && inputs.s10_4_segment_id != 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          shard_evidence_path="$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID"
          test -s "$shard_evidence_path/segment-receipt.pending.json"
          test ! -e "$shard_evidence_path/segment-receipt.json"
          jq -cS '.receiptKind = "s10.4-segment" | .complete = true' \
            "$shard_evidence_path/segment-receipt.pending.json" \
            > "$RUNNER_TEMP/s10-4-segment-receipt.final.json"
          mv "$RUNNER_TEMP/s10-4-segment-receipt.final.json" \
            "$shard_evidence_path/segment-receipt.json"
          rm -f "$shard_evidence_path/segment-receipt.pending.json"
          test -s "$shard_evidence_path/segment-receipt.json"
          test ! -e "$shard_evidence_path/segment-receipt.pending.json"
          jq -e '
            .receiptKind == "s10.4-segment"
            and .complete == true
            and .finalAcceptanceEligible == false
            and .segmentTerminalAttachmentCount == 1
          ' "$shard_evidence_path/segment-receipt.json" > /dev/null

      - name: Record GetMac development-only lane
        if: ${{ always() && inputs.runner_provider == 'getmac' }}
        shell: bash
        env:
          GETMAC_DISPATCH_SHARD_ID: ${{ inputs.s10_4_shard_id }}
          GETMAC_PRIOR_JOB_STATUS: ${{ job.status }}
          GETMAC_RUNNER_NAME: ${{ runner.name }}
          GETMAC_RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          artifact_dir="${CI_ARTIFACT_DIR:-$RUNNER_TEMP/FieldEvidenceCI}"
          mkdir -p "$artifact_dir"
          resolved_developer_dir=""
          if test -s "$artifact_dir/runner-provider.txt"; then
            resolved_developer_dir="$(awk -F= '$1 == "developer_dir" {print substr($0, index($0, "=") + 1)}' \
              "$artifact_dir/runner-provider.txt")"
          fi
          runner_image_os="$(sw_vers -productName)"
          runner_image_version="$(sw_vers -productVersion)"
          runner_image_architecture="$(uname -m)"
          record_shard_id="${CI_S10_4_SHARD_ID:-$GETMAC_DISPATCH_SHARD_ID}"
          test -n "$runner_image_os"
          test -n "$runner_image_version"
          test -n "$runner_image_architecture"
          test "$record_shard_id" = "$GETMAC_DISPATCH_SHARD_ID"
          jq -n \
            --arg laneID "getmac-xcode-26.6-development-only" \
            --arg provider "GetMac" \
            --arg runnerLabel "$CI_RUNNER_LABEL" \
            --arg runnerName "$GETMAC_RUNNER_NAME" \
            --arg runnerArchitecture "$GETMAC_RUNNER_ARCHITECTURE" \
            --arg runnerImageOS "$runner_image_os" \
            --arg runnerImageVersion "$runner_image_version" \
            --arg runnerImageArchitecture "$runner_image_architecture" \
            --arg resolvedDeveloperDirectory "$resolved_developer_dir" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg headSHA "$GITHUB_SHA" \
            --arg runID "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg shardID "$record_shard_id" \
            --arg expectedXcodeVersion "$EXPECTED_XCODE_VERSION" \
            --arg expectedXcodeBuild "$EXPECTED_XCODE_BUILD" \
            --arg simulatorRuntime "${SIMULATOR_RUNTIME:-}" \
            --arg simulatorRuntimeBuild "${SIMULATOR_RUNTIME_BUILD:-}" \
            --arg priorJobStatus "$GETMAC_PRIOR_JOB_STATUS" '
              {
                schemaVersion: 1,
                laneID: $laneID,
                provider: $provider,
                runnerLabel: $runnerLabel,
                runnerName: $runnerName,
                runnerArchitecture: $runnerArchitecture,
                runnerImageOS: $runnerImageOS,
                runnerImageVersion: $runnerImageVersion,
                runnerImageArchitecture: $runnerImageArchitecture,
                resolvedDeveloperDirectory: $resolvedDeveloperDirectory,
                repository: $repository,
                ref: $ref,
                headSHA: $headSHA,
                runID: $runID,
                runAttempt: $runAttempt,
                shardID: $shardID,
                expectedXcodeVersion: $expectedXcodeVersion,
                expectedXcodeBuild: $expectedXcodeBuild,
                simulatorRuntime: $simulatorRuntime,
                simulatorRuntimeBuild: $simulatorRuntimeBuild,
                priorJobStatus: $priorJobStatus,
                rawEvidenceOnly: true,
                finalAcceptanceEligible: false
              }
            ' > "$artifact_dir/getmac-development-only-lane.json"
          jq -e '
            (keys == [
              "expectedXcodeBuild",
              "expectedXcodeVersion",
              "finalAcceptanceEligible",
              "headSHA",
              "laneID",
              "priorJobStatus",
              "provider",
              "rawEvidenceOnly",
              "ref",
              "repository",
              "resolvedDeveloperDirectory",
              "runAttempt",
              "runID",
              "runnerArchitecture",
              "runnerImageArchitecture",
              "runnerImageOS",
              "runnerImageVersion",
              "runnerLabel",
              "runnerName",
              "schemaVersion",
              "shardID",
              "simulatorRuntime",
              "simulatorRuntimeBuild"
            ])
            and (.schemaVersion == 1)
            and (.laneID == "getmac-xcode-26.6-development-only")
            and (.provider == "GetMac")
            and (.runnerLabel == "getmac-tahoe")
            and (.runnerName | type == "string" and length > 0)
            and (.runnerArchitecture == "ARM64")
            and (.runnerImageOS == "macOS")
            and (.runnerImageVersion == "26.5.2")
            and (.runnerImageArchitecture == "arm64")
            and (.resolvedDeveloperDirectory
              | type == "string" and test("^/.+/Contents/Developer$"))
            and (.repository == env.GITHUB_REPOSITORY)
            and (.ref == env.GITHUB_REF)
            and (.headSHA == env.GITHUB_SHA)
            and (.runID == env.GITHUB_RUN_ID)
            and (.runAttempt == env.GITHUB_RUN_ATTEMPT)
            and (.shardID == env.GETMAC_DISPATCH_SHARD_ID)
            and (.expectedXcodeVersion == "Xcode 26.6")
            and (.expectedXcodeBuild == "Build version 17F113")
            and (
              ((.shardID | startswith("s10.4.current."))
                and .simulatorRuntime == "iOS 26.2"
                and .simulatorRuntimeBuild == "23C54")
              or
              ((.shardID | startswith("s10.4.minimum."))
                and .simulatorRuntime == "iOS 18.0"
                and .simulatorRuntimeBuild == "22A3351")
            )
            and (.priorJobStatus == env.GETMAC_PRIOR_JOB_STATUS)
            and (
              .priorJobStatus == "success"
              or .priorJobStatus == "failure"
              or .priorJobStatus == "cancelled"
            )
            and (.rawEvidenceOnly == true)
            and (.finalAcceptanceEligible == false)
          ' "$artifact_dir/getmac-development-only-lane.json" > /dev/null

      - name: Verify Bitrise evidence contains no cache credentials
        id: bitrise_credential_scan
        if: ${{ always() && inputs.runner_provider == 'bitrise' }}
        shell: bash
        env:
          BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN }}
          BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ vars.BITRISE_BUILD_CACHE_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          test -n "$BITRISE_BUILD_CACHE_AUTH_TOKEN"
          test "$BITRISE_BUILD_CACHE_WORKSPACE_ID" = "c70b2962648b79fb"
          mkdir -p "$CI_ARTIFACT_DIR"
          set +e
          contaminated_file_count="$(python3 - "$CI_ARTIFACT_DIR" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          needles = [
              value.encode()
              for name in ("BITRISE_BUILD_CACHE_AUTH_TOKEN", "BITRISE_BUILD_CACHE_WORKSPACE_ID")
              if (value := os.environ.get(name, ""))
          ]
          contaminated = 0
          max_tail = max((len(needle) for needle in needles), default=1) - 1
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              matched = False
              tail = b""
              with path.open("rb") as stream:
                  while chunk := stream.read(1024 * 1024):
                      candidate = tail + chunk
                      if any(needle in candidate for needle in needles):
                          matched = True
                          break
                      tail = candidate[-max_tail:] if max_tail else b""
              contaminated += int(matched)
          print(contaminated)
          PY
          )"
          scan_status=$?
          set -e
          case "$contaminated_file_count" in "" | *[!0-9]*) contaminated_file_count=unknown ;; esac
          if test "$scan_status" -ne 0 || test "$contaminated_file_count" != 0; then
            printf 'credential_scan_passed=false\ncontaminated_file_count=%s\n' \
              "$contaminated_file_count" > "$CI_ARTIFACT_DIR/bitrise-credential-scan.txt"
            printf 'safe_to_upload=false\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf 'credential_scan_passed=true\ncontaminated_file_count=0\n' \
            > "$CI_ARTIFACT_DIR/bitrise-credential-scan.txt"
          printf 'safe_to_upload=true\n' >> "$GITHUB_OUTPUT"

      - name: Hash collected evidence
        if: ${{ always() && (inputs.runner_provider != 'bitrise' || steps.bitrise_credential_scan.outputs.safe_to_upload == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          checksum_file="$RUNNER_TEMP/FieldEvidenceCI-checksums.txt"
          rm -f "$CI_ARTIFACT_DIR/SHA256SUMS.txt"
          test -n "${CI_ARTIFACT_START_EPOCH:-}"
          test -n "${CI_SETUP_ARTIFACT_TIMEOUT_SECONDS:-}"
          test -n "${CI_SETUP_ELAPSED_SECONDS:-}"
          artifact_elapsed_seconds="$(( $(date +%s) - CI_ARTIFACT_START_EPOCH ))"
          setup_artifact_elapsed_seconds="$(( CI_SETUP_ELAPSED_SECONDS + artifact_elapsed_seconds ))"
          printf 'setup_elapsed_seconds=%s\nartifact_elapsed_seconds=%s\nsetup_artifact_elapsed_seconds=%s\nsetup_artifact_budget_seconds=%s\n' \
            "$CI_SETUP_ELAPSED_SECONDS" "$artifact_elapsed_seconds" \
            "$setup_artifact_elapsed_seconds" "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS" \
            > "$CI_ARTIFACT_DIR/artifact-budget.txt"
          (
            cd "$CI_ARTIFACT_DIR"
            find . -type f -print | LC_ALL=C sort | while IFS= read -r file; do
              shasum -a 256 "$file"
            done
          ) > "$checksum_file"
          mv "$checksum_file" "$CI_ARTIFACT_DIR/SHA256SUMS.txt"
          (
            cd "$CI_ARTIFACT_DIR"
            shasum -a 256 -c SHA256SUMS.txt
          )
          test "$setup_artifact_elapsed_seconds" -le "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS"

      - name: Recheck evidence-finalization budget
        if: ${{ always() && (inputs.runner_provider != 'bitrise' || steps.bitrise_credential_scan.outputs.safe_to_upload == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_ARTIFACT_START_EPOCH:-}"
          test -n "${CI_SETUP_ARTIFACT_TIMEOUT_SECONDS:-}"
          test -n "${CI_SETUP_ELAPSED_SECONDS:-}"
          artifact_elapsed_seconds="$(( $(date +%s) - CI_ARTIFACT_START_EPOCH ))"
          setup_artifact_elapsed_seconds="$(( CI_SETUP_ELAPSED_SECONDS + artifact_elapsed_seconds ))"
          test "$setup_artifact_elapsed_seconds" -le "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS"

      - name: Verify selected total budget before upload
        if: ${{ always() && (inputs.runner_provider != 'bitrise' || steps.bitrise_credential_scan.outputs.safe_to_upload == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_BUDGET_START_EPOCH:-}"
          test -n "${CI_TOTAL_BUDGET_SECONDS:-}"
          case "$CI_BUDGET_START_EPOCH:$CI_TOTAL_BUDGET_SECONDS" in
            *[!0-9:]*) exit 1 ;;
          esac
          elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
          printf 'elapsed_seconds=%s\ntotal_budget_seconds=%s\n' \
            "$elapsed_seconds" "$CI_TOTAL_BUDGET_SECONDS"
          test "$elapsed_seconds" -le "$CI_TOTAL_BUDGET_SECONDS"

      - name: Remove nonaccepting partial S10.4 segment receipt
        if: ${{ always() && inputs.runner_provider == 'github' && inputs.s10_4_segment_id != 'none' && (failure() || cancelled()) }}
        shell: bash
        run: |
          set -euo pipefail
          shard_evidence_path="$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID"
          rm -f \
            "$shard_evidence_path/segment-receipt.json" \
            "$shard_evidence_path/segment-receipt.pending.json" \
            "$CI_ARTIFACT_DIR/SHA256SUMS.txt"
          test ! -e "$shard_evidence_path/segment-receipt.json"
          test ! -e "$shard_evidence_path/segment-receipt.pending.json"
          test ! -e "$CI_ARTIFACT_DIR/SHA256SUMS.txt"

      - name: Upload build evidence
        id: upload_evidence
        if: ${{ always() && (inputs.runner_provider != 'bitrise' || steps.bitrise_credential_scan.outputs.safe_to_upload == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.runner_provider == 'bitrise' && format('ios-ci-development-only-bitrise-xcode-26.6-{0}-{1}-{2}-{3}', github.run_id, github.run_attempt, inputs.s10_4_shard_id, inputs.s10_4_segment_id) || (inputs.s10_4_segment_id != 'none' && format('ios-ci-{0}-{1}-{2}-{3}', github.run_id, github.run_attempt, inputs.s10_4_shard_id, inputs.s10_4_segment_id) || (inputs.runner_provider == 'getmac' && format('ios-ci-development-only-getmac-xcode-26.6-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.s10_4_shard_id) || (inputs.s10_4_shard_id == 'none' && format('ios-ci-{0}-{1}', github.run_id, github.run_attempt) || format('ios-ci-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.s10_4_shard_id)))) }}
          path: ${{ runner.temp }}/FieldEvidenceCI
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed after Bitrise development-only evidence
        if: ${{ always() && inputs.runner_provider == 'bitrise' && steps.upload_evidence.outcome == 'success' }}
        shell: bash
        run: |
          printf '%s\n' 'Bitrise Build Hub Xcode 26.6 segmented development-only evidence is not eligible for S10.4 final acceptance.' >&2
          exit 1

      - name: Fail closed after GetMac development-only evidence
        if: ${{ always() && inputs.runner_provider == 'getmac' }}
        shell: bash
        run: |
          printf '%s\n' 'GetMac Xcode 26.6 development-only evidence is not yet eligible for S10.4 final acceptance.' >&2
          exit 1
