      - name: Install pinned Bitrise Build Cache command wrappers
        if: ${{ inputs.runner_provider == 'bitrise' }}
        shell: bash
        env:
          BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN }}
          BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ vars.BITRISE_BUILD_CACHE_WORKSPACE_ID }}
          BITRISE_BUILD_CACHE_BENCHMARK_PHASE_XCODE: established
        run: |
          set -euo pipefail
          test "$CI_RUNNER_PROVIDER:$CI_RUNNER_LABEL" = "bitrise:bitrise-m4-pro"
          test "$CI_S10_4_SHARD_ID" = "s10.4.current.ax-text"
          case "$CI_S10_4_SEGMENT_ID" in segment-1 | segment-2 | segment-3) ;; *) exit 1 ;; esac
          test -n "$BITRISE_BUILD_CACHE_AUTH_TOKEN"
          test "$BITRISE_BUILD_CACHE_WORKSPACE_ID" = "c70b2962648b79fb"
          test "${RUNNER_ARCH:-}" = "ARM64"
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion)" = "26.6.1"

          expected_developer_dir=/Applications/Xcode-26.6.0.app/Contents/Developer
          test "$(env -u DEVELOPER_DIR xcode-select -p)" = "$expected_developer_dir"
          test -d "$expected_developer_dir"
          DEVELOPER_DIR="$expected_developer_dir"
          export DEVELOPER_DIR
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

          installer="$RUNNER_TEMP/bitrise-build-cache-installer.sh"
          release_archive="$RUNNER_TEMP/bitrise-build-cache_3.6.2_darwin_arm64.tar.gz"
          curl --retry 5 --retry-all-errors -sSfL \
            'https://raw.githubusercontent.com/bitrise-io/bitrise-build-cache-cli/d971b485dd0519fdebb41240f1a2997d77dbf3a6/install/installer.sh' \
            -o "$installer"
          test "$(stat -f '%z' "$installer")" = 14322
          printf '%s  %s\n' \
            '8b4c6bf5f75f064b2f95b7e8a7cfa47fd2fd48fbf7de16464713be3a317fb5d4' \
            "$installer" | shasum -a 256 -c -
          cp "$installer" "$CI_ARTIFACT_DIR/bitrise-build-cache-installer.sh"

          curl --retry 5 --retry-all-errors -sSfL \
            'https://github.com/bitrise-io/bitrise-build-cache-cli/releases/download/v3.6.2/bitrise-build-cache_3.6.2_darwin_arm64.tar.gz' \
            -o "$release_archive"
          printf '%s  %s\n' \
            '17898081d7e6ea64b0393c50482cb00d84b6aa459e9954b1f26f0d64b4bf510e' \
            "$release_archive" | shasum -a 256 -c -
          cp "$release_archive" "$CI_ARTIFACT_DIR/bitrise-build-cache_3.6.2_darwin_arm64.tar.gz"

          mkdir -p /tmp/bin
          rm -f /tmp/bin/bitrise-build-cache
          /bin/sh "$installer" -b /tmp/bin -d v3.6.2 \
            > "$CI_ARTIFACT_DIR/bitrise-build-cache-installer-execution.log" 2>&1
          test -x /tmp/bin/bitrise-build-cache
          test "$(stat -f '%z' /tmp/bin/bitrise-build-cache)" = 20335490
          printf '%s  %s\n' \
            '2dfbfa4364a3a133370071715b9a7d0f9c6d7661b71abac839f723901c547bc3' \
            /tmp/bin/bitrise-build-cache | shasum -a 256 -c -
          /tmp/bin/bitrise-build-cache version \
            > "$CI_ARTIFACT_DIR/bitrise-build-cache-version.txt" 2>&1
          printf 'release=v3.6.2\narchive_sha256=%s\nbinary_bytes=20335490\nbinary_sha256=%s\n' \
            '17898081D7E6EA64B0393C50482CB00D84B6AA459E9954B1F26F0D64B4BF510E' \
            '2DFBFA4364A3A133370071715B9A7D0F9C6D7661B71ABAC839F723901C547BC3' \
            > "$CI_ARTIFACT_DIR/bitrise-build-cache-cli-verification.txt"

          helper_dir="$RUNNER_TEMP/bitrise-build-cache-command"
          command_dir="$helper_dir/bin"
          activation_helper="$helper_dir/activate.sh"
          mkdir -p "$command_dir"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' \
            'test -n "${BITRISE_BUILD_CACHE_AUTH_TOKEN:-}"' \
            'test "${BITRISE_BUILD_CACHE_WORKSPACE_ID:-}" = "c70b2962648b79fb"' \
            'test "${BITRISE_BUILD_CACHE_BENCHMARK_PHASE_XCODE:-}" = "established"' \
            'counter_file="$RUNNER_TEMP/bitrise-build-cache-activation-counter.txt"' \
            'activation_raw="$RUNNER_TEMP/bitrise-build-cache-activation.raw.log"' \
            'activation_ordinal=0' \
            'if test -s "$counter_file"; then activation_ordinal="$(cat "$counter_file")"; fi' \
            'case "$activation_ordinal" in "" | *[!0-9]*) exit 1 ;; esac' \
            'activation_ordinal="$((activation_ordinal + 1))"' \
            'printf "%s\n" "$activation_ordinal" > "$counter_file"' \
            'set +e' \
            '/tmp/bin/bitrise-build-cache activate xcode --cache --cache-push > "$activation_raw" 2>&1' \
            'activation_status=$?' \
            'set -e' \
            'python3 - "$activation_raw" "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log" "$activation_ordinal" <<'"'"'PY'"'"'' \
            'import os' \
            'import pathlib' \
            'import sys' \
            'source = pathlib.Path(sys.argv[1]).read_text(errors="replace")' \
            'for name in ("BITRISE_BUILD_CACHE_AUTH_TOKEN", "BITRISE_BUILD_CACHE_WORKSPACE_ID"):' \
            '    value = os.environ.get(name, "")' \
            '    if value:' \
            '        source = source.replace(value, "[REDACTED]")' \
            'with pathlib.Path(sys.argv[2]).open("a") as stream:' \
            '    stream.write(f"activation_ordinal={sys.argv[3]}\n")' \
            '    stream.write(source)' \
            '    if not source.endswith("\n"):' \
            '        stream.write("\n")' \
            'PY' \
            'grep -F "xcode=established" "$activation_raw" > /dev/null' \
            'rm -f "$activation_raw"' \
            'test "$activation_status" -eq 0' \
            'printf "activation_exit=0\ncache=true\ncache_push=true\nbenchmark_phase=established\n" >> "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log"' \
            > "$activation_helper"
          chmod 700 "$activation_helper"
          printf 'BITRISE_BUILD_CACHE_BENCHMARK_PHASE_XCODE=established\n' >> "$GITHUB_ENV"
          export BITRISE_BUILD_CACHE_BENCHMARK_PHASE_XCODE=established
          bash "$activation_helper"

          bitrise_wrapper_dir="$HOME/.bitrise-xcelerate/bin"
          bitrise_xcodebuild_wrapper="$bitrise_wrapper_dir/xcodebuild"
          bitrise_xcrun_wrapper="$bitrise_wrapper_dir/xcrun"
          test -x "$bitrise_xcodebuild_wrapper"
          test -x "$bitrise_xcrun_wrapper"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' \
            'bash "$CI_BITRISE_CACHE_ACTIVATE_HELPER"' \
            'exec env -u BITRISE_BUILD_CACHE_AUTH_TOKEN -u BITRISE_BUILD_CACHE_WORKSPACE_ID "$CI_BITRISE_XCODEBUILD_WRAPPER" "$@"' \
            > "$command_dir/xcodebuild"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' \
            'exec env -u BITRISE_BUILD_CACHE_AUTH_TOKEN -u BITRISE_BUILD_CACHE_WORKSPACE_ID "$CI_BITRISE_XCRUN_WRAPPER" "$@"' \
            > "$command_dir/xcrun"
          chmod 700 "$command_dir/xcodebuild" "$command_dir/xcrun"
          printf '%s\n' \
            "CI_BITRISE_CACHE_ACTIVATE_HELPER=$activation_helper" \
            "CI_BITRISE_XCODEBUILD_WRAPPER=$bitrise_xcodebuild_wrapper" \
            "CI_BITRISE_XCRUN_WRAPPER=$bitrise_xcrun_wrapper" \
            >> "$GITHUB_ENV"
          printf '%s\n' "$command_dir" >> "$GITHUB_PATH"
          export CI_BITRISE_CACHE_ACTIVATE_HELPER="$activation_helper"
          export CI_BITRISE_XCODEBUILD_WRAPPER="$bitrise_xcodebuild_wrapper"
          export CI_BITRISE_XCRUN_WRAPPER="$bitrise_xcrun_wrapper"
          export PATH="$command_dir:$PATH"
          test "$(command -v xcodebuild)" = "$command_dir/xcodebuild"
          test "$(command -v xcrun)" = "$command_dir/xcrun"
          printf 'command_xcodebuild=%s\ncommand_xcrun=%s\nbitrise_xcodebuild=%s\nbitrise_xcrun=%s\n' \
            "$(command -v xcodebuild)" "$(command -v xcrun)" \
            "$bitrise_xcodebuild_wrapper" "$bitrise_xcrun_wrapper" \
            > "$CI_ARTIFACT_DIR/bitrise-build-cache-wrapper-paths.txt"

      - name: Verify pinned toolchain, shared scheme, and simulator
        shell: bash
        env:
          BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ inputs.runner_provider == 'bitrise' && secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN || '' }}
          BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ inputs.runner_provider == 'bitrise' && vars.BITRISE_BUILD_CACHE_WORKSPACE_ID || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_ARCH:-}"
          case "$CI_RUNNER_PROVIDER:$CI_RUNNER_LABEL" in
            github:macos-26)
              test "$DEVELOPER_DIR" = "/Applications/Xcode_26.6.app/Contents/Developer"
              ;;
            getmac:getmac-tahoe)
              test "$RUNNER_ARCH" = "ARM64"
              test "$(uname -m)" = "arm64"
              test "$(sw_vers -productVersion)" = "26.5.2"
              resolved_developer_dir="$(env -u DEVELOPER_DIR xcode-select -p)"
              case "$resolved_developer_dir" in /*/Contents/Developer) ;; *) exit 1 ;; esac
              test -d "$resolved_developer_dir"
              DEVELOPER_DIR="$resolved_developer_dir"
              export DEVELOPER_DIR
              printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
              ;;
            bitrise:bitrise-m4-pro)
              test "$RUNNER_ARCH" = "ARM64"
              test "$(uname -m)" = "arm64"
              test "$(sw_vers -productVersion)" = "26.6.1"
              test "$DEVELOPER_DIR" = "/Applications/Xcode-26.6.0.app/Contents/Developer"
              test -x "$CI_BITRISE_CACHE_ACTIVATE_HELPER"
              test -x "$CI_BITRISE_XCODEBUILD_WRAPPER"
              test -x "$CI_BITRISE_XCRUN_WRAPPER"
              test "$(command -v xcodebuild)" = "$RUNNER_TEMP/bitrise-build-cache-command/bin/xcodebuild"
              test "$(command -v xcrun)" = "$RUNNER_TEMP/bitrise-build-cache-command/bin/xcrun"
              test "$CI_BITRISE_XCODEBUILD_WRAPPER" = "$HOME/.bitrise-xcelerate/bin/xcodebuild"
              test "$CI_BITRISE_XCRUN_WRAPPER" = "$HOME/.bitrise-xcelerate/bin/xcrun"
              ;;
            *) exit 1 ;;
          esac
          printf 'ImageOS=%s\nImageVersion=%s\nImageArch=%s\n' \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "${ImageArch:-unknown}" \
            | tee "$CI_ARTIFACT_DIR/runner-image.txt"
          printf 'provider=%s\nlabel=%s\nrunner_name=%s\nrunner_architecture=%s\nuname_architecture=%s\nmacos_product_version=%s\ndeveloper_dir=%s\n' \
            "$CI_RUNNER_PROVIDER" "$CI_RUNNER_LABEL" "$RUNNER_NAME" "$RUNNER_ARCH" \
            "$(uname -m)" "$(sw_vers -productVersion)" "$DEVELOPER_DIR" \
            | tee "$CI_ARTIFACT_DIR/runner-provider.txt"
          printf 'repository=%s\nref=%s\nsha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$CI_ARTIFACT_DIR/github-run.txt"
          test -d "$DEVELOPER_DIR"
          test -f "$PROJECT_PATH/project.pbxproj"
          test -f "$PROJECT_PATH/xcshareddata/xcschemes/$SCHEME.xcscheme"
          test -f Scripts/ci-selection.json
          test -f Scripts/run-with-timeout.sh
          test -f Scripts/build-smoke.sh
          test -f Scripts/test-smoke.sh
          test -f Scripts/ui-smoke.sh
          test "$EXPECTED_MINIMUM_IOS" != "UNSET"
          xcodebuild -version | tee "$CI_ARTIFACT_DIR/xcode-version.txt"
          grep -Fxq "$EXPECTED_XCODE_VERSION" "$CI_ARTIFACT_DIR/xcode-version.txt"
          grep -Fxq "$EXPECTED_XCODE_BUILD" "$CI_ARTIFACT_DIR/xcode-version.txt"
          xcodebuild -list -json -project "$PROJECT_PATH" \
            | tee "$CI_ARTIFACT_DIR/xcode-list.json"
          jq -e --arg scheme "$SCHEME" \
            '.project.schemes | index($scheme) != null' \
            "$CI_ARTIFACT_DIR/xcode-list.json" > /dev/null
          xcodebuild -showBuildSettings -project "$PROJECT_PATH" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" | tee "$CI_ARTIFACT_DIR/build-settings.txt"
          deployment_targets="$(awk -F'= ' \
            '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / {print $2}' \
            "$CI_ARTIFACT_DIR/build-settings.txt" | LC_ALL=C sort -u)"
          target_count="$(printf '%s\n' "$deployment_targets" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$target_count" -eq 1
          test "$deployment_targets" = "$EXPECTED_MINIMUM_IOS"

          if test "${CI_TASK_ID:-}" = "S10.4"; then
            printf 'provider=%s\ndevice_profile_id=%s\nruntime=%s\nruntime_build=%s\nruntime_download_version=%s\nruntime_bootstrap_enabled=%s\n' \
              "$CI_RUNNER_PROVIDER" "$CI_S10_4_DEVICE_PROFILE_ID" \
              "$SIMULATOR_RUNTIME" "$SIMULATOR_RUNTIME_BUILD" \
              "$CI_S10_4_EFFECTIVE_RUNTIME_DOWNLOAD_VERSION" \
              "$CI_S10_4_EFFECTIVE_PROVISION_RUNTIME" \
              | tee "$CI_ARTIFACT_DIR/simulator-runtime-policy.txt"
          fi

          if test "${CI_TASK_ID:-}" = "S10.4" && \
             test "$CI_RUNNER_PROVIDER" = "bitrise" && \
             test "${CI_S10_4_EFFECTIVE_PROVISION_RUNTIME:-}" = "true"; then
            bitrise_simulator_budget_start_epoch="$(date +%s)"
            printf 'CI_BITRISE_SIMULATOR_BUDGET_START_EPOCH=%s\n' \
              "$bitrise_simulator_budget_start_epoch" >> "$GITHUB_ENV"
            test "$SIMULATOR_RUNTIME:$SIMULATOR_RUNTIME_BUILD:$CI_S10_4_EFFECTIVE_RUNTIME_DOWNLOAD_VERSION" = \
              "iOS 26.2:23C54:23C54"
            xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes-before-provision.json"
            if jq -e --arg name "$SIMULATOR_RUNTIME" --arg build "$SIMULATOR_RUNTIME_BUILD" '
              any(.runtimes[];
                .name == $name and .buildversion == $build and .isAvailable == true)
            ' "$CI_ARTIFACT_DIR/simulator-runtimes-before-provision.json" > /dev/null; then
              printf 'exact_runtime_preinstalled=true\n' \
                > "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            else
              simulator_elapsed_seconds="$(( $(date +%s) - bitrise_simulator_budget_start_epoch ))"
              runtime_provision_budget_seconds="$(( CI_SIMULATOR_BOOT_TIMEOUT_SECONDS - simulator_elapsed_seconds ))"
              test "$runtime_provision_budget_seconds" -gt 0
              set +e
              bash Scripts/run-with-timeout.sh "$runtime_provision_budget_seconds" \
                env -u BITRISE_BUILD_CACHE_AUTH_TOKEN -u BITRISE_BUILD_CACHE_WORKSPACE_ID \
                  /usr/bin/xcodebuild -downloadPlatform iOS \
                  -buildVersion "$SIMULATOR_RUNTIME_BUILD" \
                  -architectureVariant universal \
                2>&1 | tee "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
              provision_pipeline_status=( "${PIPESTATUS[@]}" )
              set -e
              test "${#provision_pipeline_status[@]}" -eq 2
              printf '\nprovision_exit=%s\nprovision_tee_exit=%s\n' \
                "${provision_pipeline_status[0]}" "${provision_pipeline_status[1]}" \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
              test "${provision_pipeline_status[0]}" -eq 0
              test "${provision_pipeline_status[1]}" -eq 0
              xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
              jq -e --arg name "$SIMULATOR_RUNTIME" --arg build "$SIMULATOR_RUNTIME_BUILD" '
                any(.runtimes[];
                  .name == $name and .buildversion == $build and .isAvailable == true)
              ' "$CI_ARTIFACT_DIR/simulator-runtimes.json" > /dev/null
              printf 'provision_zero_and_exact_runtime_verified=true\n' \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            fi
          fi

          if test "${CI_TASK_ID:-}" = "S10.4" && \
             test "$CI_RUNNER_PROVIDER" != "bitrise" && \
             test "${CI_S10_4_EFFECTIVE_PROVISION_RUNTIME:-}" = "true"; then
            case "$SIMULATOR_RUNTIME:$SIMULATOR_RUNTIME_BUILD:$CI_S10_4_EFFECTIVE_RUNTIME_DOWNLOAD_VERSION" in
              "iOS 18.0:22A3351:18.0" | "iOS 26.2:23C54:26.2") ;;
              *) exit 1 ;;
            esac
            setup_elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
            runtime_provision_budget_seconds="$(( CI_SETUP_ARTIFACT_TIMEOUT_SECONDS - setup_elapsed_seconds ))"
            test "$runtime_provision_budget_seconds" -gt 0
            set +e
            bash Scripts/run-with-timeout.sh "$runtime_provision_budget_seconds" \
              xcodebuild -downloadPlatform iOS \
                -buildVersion "$CI_S10_4_EFFECTIVE_RUNTIME_DOWNLOAD_VERSION" \
              2>&1 | tee "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            provision_pipeline_status=( "${PIPESTATUS[@]}" )
            set -e
            if test "${#provision_pipeline_status[@]}" -ne 2; then
              exit 1
            fi
            printf '\nprovision_exit=%s\nprovision_tee_exit=%s\n' \
              "${provision_pipeline_status[0]}" "${provision_pipeline_status[1]}" \
              | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            if test "${provision_pipeline_status[1]}" -ne 0; then
              exit "${provision_pipeline_status[1]}"
            fi
            xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
            exact_runtime_available=false
            if jq -e --arg name "$SIMULATOR_RUNTIME" \
              --arg build "${SIMULATOR_RUNTIME_BUILD:-}" \
              'any(.runtimes[]; .name == $name and .isAvailable == true and ($build == "" or .buildversion == $build))' \
              "$CI_ARTIFACT_DIR/simulator-runtimes.json" > /dev/null; then
              exact_runtime_available=true
            fi
            if test "$exact_runtime_available" != true && \
               test -n "${SIMULATOR_RUNTIME_BUILD:-}"; then
              setup_elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
              runtime_recovery_budget_seconds="$(( CI_SETUP_ARTIFACT_TIMEOUT_SECONDS - setup_elapsed_seconds ))"
              test "$runtime_recovery_budget_seconds" -gt 0
              set +e
              bash Scripts/run-with-timeout.sh "$runtime_recovery_budget_seconds" \
                xcodebuild -downloadPlatform iOS \
                  -buildVersion "$SIMULATOR_RUNTIME_BUILD" \
                  -architectureVariant universal \
                2>&1 | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
              recovery_pipeline_status=( "${PIPESTATUS[@]}" )
              set -e
              if test "${#recovery_pipeline_status[@]}" -ne 2; then
                exit 1
              fi
              printf 'recovery_provision_exit=%s\nrecovery_provision_tee_exit=%s\n' \
                "${recovery_pipeline_status[0]}" "${recovery_pipeline_status[1]}" \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
              if test "${recovery_pipeline_status[1]}" -ne 0; then
                exit "${recovery_pipeline_status[1]}"
              fi
              xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
              if jq -e --arg name "$SIMULATOR_RUNTIME" \
                --arg build "${SIMULATOR_RUNTIME_BUILD:-}" \
                'any(.runtimes[]; .name == $name and .isAvailable == true and ($build == "" or .buildversion == $build))' \
                "$CI_ARTIFACT_DIR/simulator-runtimes.json" > /dev/null; then
                exact_runtime_available=true
              fi
            fi
            if test "$exact_runtime_available" != true; then
              if test "${provision_pipeline_status[0]}" -ne 0; then
                exit "${provision_pipeline_status[0]}"
              fi
              exit 70
            fi
            if test "${provision_pipeline_status[0]}" -ne 0; then
              printf 'provision_nonzero_but_exact_runtime_available=true\n' \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            else
              printf 'provision_zero_but_exact_runtime_verified=true\n' \
                | tee -a "$CI_ARTIFACT_DIR/simulator-runtime-provision.log"
            fi
          fi

          xcrun simctl list runtimes -j > "$CI_ARTIFACT_DIR/simulator-runtimes.json"
          xcrun simctl list devices available -j > "$CI_ARTIFACT_DIR/simulator-devices.json"
          runtime_id="$(jq -r --arg name "$SIMULATOR_RUNTIME" \
            --arg build "${SIMULATOR_RUNTIME_BUILD:-}" \
            '.runtimes[]
              | select(
                  .name == $name
                  and .isAvailable == true
                  and ($build == "" or .buildversion == $build)
                )
              | .identifier' \
            "$CI_ARTIFACT_DIR/simulator-runtimes.json" | head -n 1)"
          test -n "$runtime_id"
          simulator_udid="$(jq -r --arg runtime "$runtime_id" --arg name "$SIMULATOR_NAME" \
            '.devices[$runtime][] | select(.name == $name and .isAvailable == true) | .udid' \
            "$CI_ARTIFACT_DIR/simulator-devices.json" | head -n 1)"
          if test -z "$simulator_udid" && \
             test "${CI_TASK_ID:-}" = "S10.4" && \
             test "${CI_S10_4_EFFECTIVE_PROVISION_RUNTIME:-}" = "true"; then
            xcrun simctl list devicetypes -j > "$CI_ARTIFACT_DIR/simulator-device-types.json"
            simulator_device_type_id="$(jq -r --arg name "$SIMULATOR_NAME" \
              '.devicetypes[] | select(.name == $name) | .identifier' \
              "$CI_ARTIFACT_DIR/simulator-device-types.json" | head -n 1)"
            test -n "$simulator_device_type_id"
            simulator_udid="$(xcrun simctl create \
              "$SIMULATOR_NAME" "$simulator_device_type_id" "$runtime_id")"
            test -n "$simulator_udid"
            xcrun simctl list devices available -j > "$CI_ARTIFACT_DIR/simulator-devices.json"
          fi
          test -n "$simulator_udid"
          simulator_state="$(jq -er --arg runtime "$runtime_id" --arg udid "$simulator_udid" '
            [.devices[$runtime][] | select(.udid == $udid) | .state]
            | if length == 1 then .[0]
              else error("expected exactly one selected Simulator state")
              end
          ' "$CI_ARTIFACT_DIR/simulator-devices.json")"
          case "$simulator_state" in
            Shutdown | Booted) ;;
            *) exit 1 ;;
          esac
          selected_runtime_build="$(jq -er --arg runtime "$runtime_id" \
            '.runtimes[] | select(.identifier == $runtime) | .buildversion' \
            "$CI_ARTIFACT_DIR/simulator-runtimes.json")"
          if test "${CI_TASK_ID:-}" = "S10.4"; then
            test "$selected_runtime_build" = "$SIMULATOR_RUNTIME_BUILD"
          fi
          printf 'runtime=%s\nruntime_build=%s\nname=%s\nudid=%s\ninitial_state=%s\n' \
            "$SIMULATOR_RUNTIME" "$selected_runtime_build" "$SIMULATOR_NAME" \
            "$simulator_udid" "$simulator_state" \
            | tee "$CI_ARTIFACT_DIR/simulator-selection.txt"
          printf 'CI_DESTINATION=platform=iOS Simulator,id=%s\nCI_SIMULATOR_UDID=%s\nCI_SIMULATOR_INITIAL_STATE=%s\n' \
            "$simulator_udid" "$simulator_udid" "$simulator_state" >> "$GITHUB_ENV"
          if test "${CI_TASK_ID:-}" = "S10.4"; then
            printf 'TEST_RUNNER_CI_SIMULATOR_UDID=%s\n' "$simulator_udid" >> "$GITHUB_ENV"
          fi

      - name: Verify setup budget before build
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CI_BUDGET_START_EPOCH:-}"
          test -n "${CI_SETUP_ARTIFACT_TIMEOUT_SECONDS:-}"
          setup_elapsed_seconds="$(( $(date +%s) - CI_BUDGET_START_EPOCH ))"
          printf 'setup_elapsed_seconds=%s\nsetup_budget_seconds=%s\n' \
            "$setup_elapsed_seconds" "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS" \
            | tee "$CI_ARTIFACT_DIR/setup-budget.txt"
          printf 'CI_SETUP_ELAPSED_SECONDS=%s\n' \
            "$setup_elapsed_seconds" >> "$GITHUB_ENV"
          test "$setup_elapsed_seconds" -le "$CI_SETUP_ARTIFACT_TIMEOUT_SECONDS"

      # INFRA_RECOVERY_BEGIN: simulator-readiness-scheduling
      - name: Boot selected Simulator
        id: simulator_boot
        background: true
        shell: bash
        run: |
          set -euo pipefail
          test "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS" = "900"
          test -n "${CI_SIMULATOR_UDID:-}"
          case "${CI_SIMULATOR_INITIAL_STATE:-}" in
            Shutdown) simulator_boot_action="boot" ;;
            Booted) simulator_boot_action="already-booted" ;;
            *) exit 1 ;;
          esac
          simulator_boot_start_epoch="$(date +%s)"
          case "${CI_BUDGET_START_EPOCH:?}" in *[!0-9]* | "") exit 1 ;; esac
          case "$simulator_boot_start_epoch" in *[!0-9]* | "") exit 1 ;; esac
          test "$simulator_boot_start_epoch" -ge "$CI_BUDGET_START_EPOCH"
          simulator_boot_budget_seconds="$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS"
          if test "$CI_RUNNER_PROVIDER" = "bitrise"; then
            case "${CI_BITRISE_SIMULATOR_BUDGET_START_EPOCH:-}" in *[!0-9]* | "") exit 1 ;; esac
            simulator_elapsed_seconds="$(( simulator_boot_start_epoch - CI_BITRISE_SIMULATOR_BUDGET_START_EPOCH ))"
            simulator_boot_budget_seconds="$(( CI_SIMULATOR_BOOT_TIMEOUT_SECONDS - simulator_elapsed_seconds ))"
            test "$simulator_boot_budget_seconds" -gt 0
          fi
          printf 'start_epoch=%s\nudid=%s\ninitial_state=%s\naction=%s\nbudget_seconds=%s\ncommand=xcrun simctl bootstatus %s -b\n' \
            "$simulator_boot_start_epoch" "$CI_SIMULATOR_UDID" \
            "$CI_SIMULATOR_INITIAL_STATE" "$simulator_boot_action" \
            "$simulator_boot_budget_seconds" "$CI_SIMULATOR_UDID" \
            | tee "$CI_ARTIFACT_DIR/simulator-boot-start.log"
          printf 'CI_SIMULATOR_BOOT_START_EPOCH=%s\n' \
            "$simulator_boot_start_epoch" >> "$GITHUB_ENV"
          set +e
          bash Scripts/run-with-timeout.sh "$simulator_boot_budget_seconds" \
            xcrun simctl bootstatus "$CI_SIMULATOR_UDID" -b \
            2>&1 | tee "$CI_ARTIFACT_DIR/simulator-boot.log"
          simulator_boot_pipeline_status=( "${PIPESTATUS[@]}" )
          if test "${#simulator_boot_pipeline_status[@]}" -ne 2; then
            exit 1
          fi
          simulator_boot_end_epoch="$(date +%s)"
          printf '\nend_epoch=%s\nbootstatus_exit=%s\ntee_exit=%s\n' \
            "$simulator_boot_end_epoch" "${simulator_boot_pipeline_status[0]}" \
            "${simulator_boot_pipeline_status[1]}" \
            | tee -a "$CI_ARTIFACT_DIR/simulator-boot.log"
          simulator_boot_status_log_pipeline_status=( "${PIPESTATUS[@]}" )
          if test "${simulator_boot_pipeline_status[0]}" -ne 0; then
            exit "${simulator_boot_pipeline_status[0]}"
          fi
          if test "${simulator_boot_pipeline_status[1]}" -ne 0; then
            exit "${simulator_boot_pipeline_status[1]}"
          fi
          if test "${simulator_boot_status_log_pipeline_status[0]}" -ne 0; then
            exit "${simulator_boot_status_log_pipeline_status[0]}"
          fi
          if test "${simulator_boot_status_log_pipeline_status[1]}" -ne 0; then
            exit "${simulator_boot_status_log_pipeline_status[1]}"
          fi
          set -e
          case "$simulator_boot_end_epoch" in *[!0-9]* | "") exit 1 ;; esac
          test "$simulator_boot_end_epoch" -ge "$simulator_boot_start_epoch"
          simulator_boot_ready_elapsed_seconds="$(( simulator_boot_end_epoch - simulator_boot_start_epoch ))"
          printf 'ready_epoch=%s\nready_udid=%s\nready_elapsed_seconds=%s\nbudget_seconds=%s\n' \
            "$simulator_boot_end_epoch" "$CI_SIMULATOR_UDID" \
            "$simulator_boot_ready_elapsed_seconds" \
            "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS" \
            | tee -a "$CI_ARTIFACT_DIR/simulator-boot.log"
          test "$simulator_boot_ready_elapsed_seconds" -ge 0
          test "$simulator_boot_ready_elapsed_seconds" -le "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS"
          if test "$CI_RUNNER_PROVIDER" = "bitrise"; then
            bitrise_simulator_total_elapsed_seconds="$(( simulator_boot_end_epoch - CI_BITRISE_SIMULATOR_BUDGET_START_EPOCH ))"
            test "$bitrise_simulator_total_elapsed_seconds" -le "$CI_SIMULATOR_BOOT_TIMEOUT_SECONDS"
            printf 'bitrise_simulator_total_elapsed_seconds=%s\n' \
              "$bitrise_simulator_total_elapsed_seconds" \
              | tee -a "$CI_ARTIFACT_DIR/simulator-boot.log"
          fi
          printf '%s\n' \
            "CI_SIMULATOR_READY_UDID=$CI_SIMULATOR_UDID" \
            "CI_SIMULATOR_READY_EPOCH=$simulator_boot_end_epoch" \
            "CI_SIMULATOR_READY_ELAPSED_SECONDS=$simulator_boot_ready_elapsed_seconds" \
            >> "$GITHUB_ENV"

      - name: Build unsigned simulator app
        shell: bash
        env:
          BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ inputs.runner_provider == 'bitrise' && secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN || '' }}
          BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ inputs.runner_provider == 'bitrise' && vars.BITRISE_BUILD_CACHE_WORKSPACE_ID || '' }}
        run: |
          set -euo pipefail
          bash Scripts/run-with-timeout.sh "$CI_BUILD_TIMEOUT_SECONDS" \
            bash Scripts/build-smoke.sh 2>&1 | tee "$CI_ARTIFACT_DIR/build-smoke.log"

      - name: Await selected Simulator boot
        wait: simulator_boot
      # INFRA_RECOVERY_END: simulator-readiness-scheduling

      - name: Run targeted tests
        shell: bash
        env:
          BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ inputs.runner_provider == 'bitrise' && secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN || '' }}
          BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ inputs.runner_provider == 'bitrise' && vars.BITRISE_BUILD_CACHE_WORKSPACE_ID || '' }}
        run: |
          set -euo pipefail
          bash Scripts/run-with-timeout.sh "$CI_TEST_TIMEOUT_SECONDS" \
            bash Scripts/test-smoke.sh 2>&1 | tee "$CI_ARTIFACT_DIR/test-smoke.log"

      - name: Run task-authorized UI smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke == true }}
        shell: bash
        env:
          BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ inputs.runner_provider == 'bitrise' && secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN || '' }}
          BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ inputs.runner_provider == 'bitrise' && vars.BITRISE_BUILD_CACHE_WORKSPACE_ID || '' }}
        run: |
          set -euo pipefail
          bash Scripts/run-with-timeout.sh "$CI_UI_TIMEOUT_SECONDS" \
            bash Scripts/ui-smoke.sh 2>&1 | tee "$CI_ARTIFACT_DIR/ui-smoke.log"

      - name: Retain Bitrise development-only segment evidence
        if: ${{ always() && inputs.runner_provider == 'bitrise' }}
        shell: bash
        env:
          BITRISE_PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$CI_RUNNER_PROVIDER:$CI_RUNNER_LABEL" = "bitrise:bitrise-m4-pro"
          test "$CI_S10_4_SHARD_ID" = "s10.4.current.ax-text"
          case "$CI_S10_4_SEGMENT_ID" in segment-1 | segment-2 | segment-3) ;; *) exit 1 ;; esac
          development_path="$CI_ARTIFACT_DIR/bitrise-development/$CI_S10_4_SEGMENT_ID"
          mkdir -p "$development_path"
          if test -d "$RUNNER_TEMP/FieldEvidenceUISmokeAttachments"; then
            cp -R "$RUNNER_TEMP/FieldEvidenceUISmokeAttachments" \
              "$development_path/ui-attachments"
          fi
          test ! -e "$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID/segment-receipt.json"
          test ! -e "$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID/segment-receipt.pending.json"
          plan_sha256="$(shasum -a 256 Scripts/s10-4-segment-plan.json | awk '{print toupper($1)}')"
          activation_count=0
          if test -s "$RUNNER_TEMP/bitrise-build-cache-activation-counter.txt"; then
            activation_count="$(cat "$RUNNER_TEMP/bitrise-build-cache-activation-counter.txt")"
          fi
          case "$activation_count" in "" | *[!0-9]*) exit 1 ;; esac
          benchmark_phase="unavailable"
          cache_operational=false
          established_count=0
          if test -s "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log"; then
            established_count="$(grep -c '^benchmark_phase=established$' "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log" || true)"
          fi
          if test "$activation_count" -ge 1 \
            && test "$established_count" -eq "$activation_count" \
            && ! grep -F 'cache disabled, analytics only' \
              "$CI_ARTIFACT_DIR/bitrise-build-cache-activation.log" > /dev/null; then
            benchmark_phase=established
            cache_operational=true
          fi
          artifact_name="ios-ci-development-only-bitrise-xcode-26.6-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_S10_4_SHARD_ID-$CI_S10_4_SEGMENT_ID"
          jq -n \
            --arg laneID "bitrise-build-hub-xcode-26.6-segmented-development-only" \
            --arg provider "$CI_RUNNER_PROVIDER" \
            --arg runnerLabel "$CI_RUNNER_LABEL" \
            --arg runnerName "$RUNNER_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg head "$GITHUB_SHA" \
            --arg runID "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg shardID "$CI_S10_4_SHARD_ID" \
            --arg segmentID "$CI_S10_4_SEGMENT_ID" \
            --arg artifactName "$artifact_name" \
            --arg planSHA256 "$plan_sha256" \
            --arg priorJobStatus "$BITRISE_PRIOR_JOB_STATUS" \
            --arg benchmarkPhase "$benchmark_phase" \
            --argjson cacheOperational "$cache_operational" \
            --argjson activationCount "$activation_count" '
              {
                schemaVersion: 1,
                laneID: $laneID,
                provider: $provider,
                runnerLabel: $runnerLabel,
                runnerName: $runnerName,
                repository: $repository,
                ref: $ref,
                head: $head,
                runID: ($runID | tonumber),
                runAttempt: ($runAttempt | tonumber),
                shardID: $shardID,
                segmentID: $segmentID,
                artifactName: $artifactName,
                segmentPlanSHA256: $planSHA256,
                priorJobStatus: $priorJobStatus,
                cacheEnabled: true,
                cachePushEnabled: true,
                benchmarkPhase: $benchmarkPhase,
                cacheOperational: $cacheOperational,
                cacheActivationCount: $activationCount,
                workspaceConfigured: true,
                independentSession: true,
                crossSessionBuildReuse: false,
                crossSessionResultReuse: false,
                crossSessionSimulatorReuse: false,
                crossSessionTestWithoutBuilding: false,
                acceptingSegmentReceipt: false,
                feedsAcceptanceAssembler: false,
                rawEvidenceOnly: true,
                finalAcceptanceEligible: false
              }
            ' > "$development_path/development-segment-record.json"
          jq -e '
            .schemaVersion == 1
            and .laneID == "bitrise-build-hub-xcode-26.6-segmented-development-only"
            and .provider == "bitrise"
            and .runnerLabel == "bitrise-m4-pro"
            and .shardID == "s10.4.current.ax-text"
            and (.segmentID | IN("segment-1", "segment-2", "segment-3"))
            and .cacheEnabled == true
            and .cachePushEnabled == true
            and .benchmarkPhase == "established"
            and .cacheOperational == true
            and .cacheActivationCount >= 1
            and .workspaceConfigured == true
            and .independentSession == true
            and .crossSessionBuildReuse == false
            and .crossSessionResultReuse == false
            and .crossSessionSimulatorReuse == false
            and .crossSessionTestWithoutBuilding == false
            and .acceptingSegmentReceipt == false
            and .feedsAcceptanceAssembler == false
            and .rawEvidenceOnly == true
            and .finalAcceptanceEligible == false
          ' "$development_path/development-segment-record.json" > /dev/null

      - name: Retain S10.4 segment evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_provider == 'github' && inputs.run_ui_smoke == true && inputs.s10_4_shard_id != 'none' && inputs.s10_4_segment_id != 'none' }}
        shell: bash
        env:
          DISPATCH_S10_4_SHARD_ID: ${{ inputs.s10_4_shard_id }}
          DISPATCH_S10_4_SEGMENT_ID: ${{ inputs.s10_4_segment_id }}
        run: |
          set -euo pipefail
          test "$CI_TASK_ID" = "S10.4"
          test "$CI_RUNNER_PROVIDER" = "github"
          test "$CI_S10_4_SHARD_ID" = "s10.4.current.ax-text"
          test "$CI_S10_4_SHARD_ID" = "$DISPATCH_S10_4_SHARD_ID"
          test "$CI_S10_4_SEGMENT_ID" = "$DISPATCH_S10_4_SEGMENT_ID"
          test -d "$RUNNER_TEMP/FieldEvidenceUISmokeAttachments"
          attachment_export_path="$RUNNER_TEMP/FieldEvidenceUISmokeAttachments"
          attachment_manifest_path="$attachment_export_path/manifest.json"
          test -s "$attachment_manifest_path"

          segment_json="$(jq -cer --arg segment "$CI_S10_4_SEGMENT_ID" \
            '.segments[] | select(.segmentID == $segment)' \
            Scripts/s10-4-segment-plan.json)"
          expected_state_count="$(jq -r '.stateCount' <<< "$segment_json")"
          expected_replay_count="$(jq -r '.replayCount' <<< "$segment_json")"
          expected_resume_setup_count="$(jq -r '.resumeSetup.rowCount // 0' <<< "$segment_json")"
          expected_owned_path="$RUNNER_TEMP/s10-4-segment-owned.json"
          expected_replay_path="$RUNNER_TEMP/s10-4-segment-replay.json"
          jq -c '.ownedStateIDs' <<< "$segment_json" > "$expected_owned_path"
          jq -c '.replayStateIDs' <<< "$segment_json" > "$expected_replay_path"
          test "$(jq 'length' "$expected_owned_path")" -eq "$expected_state_count"
          test "$(jq 'length' "$expected_replay_path")" -eq "$expected_replay_count"

          observed_marker_path="$RUNNER_TEMP/s10-4-segment-markers.json"
          sed -n 's/^S10_MIGRATION_STATE state=//p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            | jq -Rsc 'split("\n") | map(select(length > 0))' \
            > "$observed_marker_path"
          cmp -s "$expected_owned_path" "$observed_marker_path"

          replay_ndjson_path="$RUNNER_TEMP/s10-4-segment-replay.ndjson"
          sed -n 's/^S10_4_SEGMENT_REPLAY //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$replay_ndjson_path"
          jq -s '.' "$replay_ndjson_path" > "$RUNNER_TEMP/s10-4-segment-replay-rows.json"
          jq -c '[.[].stateID]' "$RUNNER_TEMP/s10-4-segment-replay-rows.json" \
            > "$RUNNER_TEMP/s10-4-segment-replay-state-ids.json"
          cmp -s "$expected_replay_path" \
            "$RUNNER_TEMP/s10-4-segment-replay-state-ids.json"
          jq -e --arg shard "$CI_S10_4_SHARD_ID" \
            --arg segment "$CI_S10_4_SEGMENT_ID" \
            --argjson replayCount "$expected_replay_count" '
              length == $replayCount
              and all(to_entries[];
                .value.shardID == $shard
                and .value.segmentID == $segment
                and (.value.stateID | type == "string" and startswith("state."))
                and (.value.ordinal | type == "number" and floor == .)
                and .value.ordinal == (.key + 1))
            ' "$RUNNER_TEMP/s10-4-segment-replay-rows.json" > /dev/null

          resume_setup_ndjson_path="$RUNNER_TEMP/s10-4-segment-resume-setup.ndjson"
          resume_setup_rows_path="$RUNNER_TEMP/s10-4-segment-resume-setup-rows.json"
          sed -n 's/^S10_4_SEGMENT_RESUME_SETUP //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$resume_setup_ndjson_path"
          jq -s '.' "$resume_setup_ndjson_path" > "$resume_setup_rows_path"
          jq -e --arg shard "$CI_S10_4_SHARD_ID" \
            --arg segment "$CI_S10_4_SEGMENT_ID" \
            --argjson expected "$segment_json" \
            --argjson replayCount "$expected_replay_count" \
            --argjson setupCount "$expected_resume_setup_count" '
              length == $setupCount
              and if $setupCount == 0 then
                . == [] and $expected.resumeSetup == null
              else
                $setupCount == 1
                and .[0] == {
                  schemaVersion: 1,
                  acceptanceEligible: false,
                  shardID: $shard,
                  segmentID: $segment,
                  setupID: $expected.resumeSetup.setupID,
                  sourceOrdinal: $expected.resumeSetup.sourceOrdinal,
                  sourceStateID: $expected.resumeSetup.sourceStateID,
                  skippedStartOrdinal: $expected.resumeSetup.skippedStartOrdinal,
                  skippedEndOrdinal: $expected.resumeSetup.skippedEndOrdinal,
                  targetOrdinal: $expected.resumeSetup.targetOrdinal,
                  targetStateID: $expected.resumeSetup.targetStateID,
                  cursorBeforeResume: $expected.resumeSetup.cursorBeforeResume,
                  cursorAfterResume: $expected.resumeSetup.cursorAfterResume,
                  localReplayCount: $replayCount,
                  dependencyOwnedStateSHA256:
                    $expected.resumeSetup.dependencyOwnedStateSHA256,
                  applicationForeground:
                    $expected.resumeSetup.applicationForeground,
                  purchaseVerified: $expected.resumeSetup.purchaseVerified,
                  pendingDifferentIssueReceiptVerified:
                    $expected.resumeSetup.pendingDifferentIssueReceiptVerified,
                  reportFailureRouteVerified:
                    $expected.resumeSetup.reportFailureRouteVerified,
                  renderFailureArgumentCount:
                    $expected.resumeSetup.renderFailureArgumentCount
                }
              end
            ' "$resume_setup_rows_path" > /dev/null

          test "$(grep -Ec '^S10_4_AX ' "$CI_ARTIFACT_DIR/ui-smoke.log" || true)" -eq 0
          test "$(grep -Ec '^S10_4_FRONTIER_REPLAY ' "$CI_ARTIFACT_DIR/ui-smoke.log" || true)" -eq 0
          diagnostic_count="$(grep -Ec '^S10_4_.*DIAGNOSTIC' "$CI_ARTIFACT_DIR/ui-smoke.log" || true)"
          test "$diagnostic_count" -eq 0
          test "$(grep -Eic 'Lost connection to testmanagerd|XCTHTestOperationCoordinatorErrorDomain' "$CI_ARTIFACT_DIR/ui-smoke.log" || true)" -eq 0
          jq -e '
            [
              .[]?.attachments[]?
              | select(
                  .suggestedHumanReadableName == "UI Snapshot"
                  or .suggestedHumanReadableName == "Synthesized Event"
                  or .suggestedHumanReadableName == "Screen Recording"
                  or (
                    (.suggestedHumanReadableName // "") as $name
                    | (($name | startswith("S10.4 candidate ")) | not)
                      and ($name | test("diagnostic"; "i"))
                  )
                  or .isAssociatedWithFailure == true)
            ] | length == 0
          ' "$attachment_manifest_path" > /dev/null

          segment_terminal_name="S10.4 segment terminal $CI_S10_4_SEGMENT_ID $CI_S10_4_SHARD_ID"
          terminal_export_file="$(jq -er --arg name "$segment_terminal_name" '
            [
              .[]
              | select(
                  type == "object"
                  and (.testIdentifier | type == "string")
                  and (.testIdentifier | startswith("S10_4AutomatedBrandLabUITests/"))
                  and (.attachments | type == "array"))
              | .attachments[]
              | select(
                  type == "object"
                  and .isAssociatedWithFailure == false
                  and (.suggestedHumanReadableName | type == "string")
                  and ((.suggestedHumanReadableName
                    | sub("_0_[0-9A-Fa-f-]{36}\\."; ".")) == $name)
                  and (.exportedFileName | type == "string")
                  and (.exportedFileName | test("^[A-Za-z0-9._-]+$")))
              | .exportedFileName
            ]
            | if length == 1 then .[0]
              else error("expected exactly one segment terminal screenshot") end
          ' "$attachment_manifest_path")"
          terminal_export_path="$attachment_export_path/$terminal_export_file"
          test -f "$terminal_export_path"
          test ! -L "$terminal_export_path"
          test "$(LC_ALL=C od -An -tx1 -N8 "$terminal_export_path" \
            | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" = \
            "89504e470d0a1a0a"

          shard_evidence_path="$CI_ARTIFACT_DIR/s10-4/$CI_S10_4_SHARD_ID"
          candidate_path="$shard_evidence_path/candidates"
          state_ax_path="$CI_ARTIFACT_DIR/ax/$CI_S10_4_SHARD_ID"
          state_contrast_path="$CI_ARTIFACT_DIR/contrast/$CI_S10_4_SHARD_ID"
          mkdir -p "$candidate_path" "$state_ax_path" "$state_contrast_path"
          cp "$attachment_manifest_path" \
            "$shard_evidence_path/xcresult-attachment-manifest.json"
          cp "$observed_marker_path" "$shard_evidence_path/owned-state-ids.json"
          cp "$RUNNER_TEMP/s10-4-segment-replay-rows.json" \
            "$shard_evidence_path/replay-rows.json"
          cp "$resume_setup_rows_path" \
            "$shard_evidence_path/resume-setup-rows.json"

          candidate_prefix="S10.4 candidate $CI_S10_4_SHARD_ID "
          jq -e --arg prefix "$candidate_prefix" --argjson expected "$expected_state_count" \
            --slurpfile owned "$expected_owned_path" '
            ([
              .[]
              | select(
                  type == "object"
                  and (.testIdentifier | type == "string")
                  and (.testIdentifier | startswith("S10_4AutomatedBrandLabUITests/"))
                  and (.attachments | type == "array"))
              | .attachments[]
              | select(
                  type == "object"
                  and .isAssociatedWithFailure == false
                  and (.suggestedHumanReadableName | type == "string")
                  and (.suggestedHumanReadableName | startswith($prefix))
                  and (.exportedFileName | type == "string")
                  and (.exportedFileName | test("^[A-Za-z0-9._-]+$")))
              | {
                  stateID: (.suggestedHumanReadableName
                    | ltrimstr($prefix)
                    | sub("_0_[0-9A-Fa-f-]{36}\\."; ".")),
                  exportedFileName: .exportedFileName
                }
            ]) as $candidates
            | ($owned[0]) as $ownedStateIDs
            | if ($candidates | length) != $expected then
                error("segment candidate count")
              elif ($candidates | map(.stateID) | unique | length) != $expected then
                error("duplicate segment candidate state")
              elif ($candidates | map(.exportedFileName) | unique | length) != $expected then
                error("duplicate segment candidate file")
              elif (($candidates | map(.stateID) | sort) != ($ownedStateIDs | sort)) then
                error("segment candidate state set")
              else
                [
                  $ownedStateIDs[] as $stateID
                  | $candidates[]
                  | select(.stateID == $stateID)
                ]
              end
          ' "$attachment_manifest_path" > "$shard_evidence_path/candidate-exports.json"
          jq -c '[.[].stateID]' "$shard_evidence_path/candidate-exports.json" \
            > "$RUNNER_TEMP/s10-4-segment-candidate-state-ids.json"
          cmp -s "$expected_owned_path" \
            "$RUNNER_TEMP/s10-4-segment-candidate-state-ids.json"

          : > "$RUNNER_TEMP/s10-4-segment-candidate-files.tsv"
          while IFS=$'\t' read -r state_id exported_file_name; do
            source_path="$attachment_export_path/$exported_file_name"
            destination_path="$candidate_path/$state_id.png"
            test -f "$source_path"
            test ! -L "$source_path"
            test "$(LC_ALL=C od -An -tx1 -N8 "$source_path" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" = \
              "89504e470d0a1a0a"
            cp "$source_path" "$destination_path"
            cmp -s "$source_path" "$destination_path"
            printf '%s\t%s\t%s\t%s\n' "$state_id" "candidates/$state_id.png" \
              "$(shasum -a 256 "$destination_path" | awk '{print toupper($1)}')" \
              "$(stat -f '%z' "$destination_path")" \
              >> "$RUNNER_TEMP/s10-4-segment-candidate-files.tsv"
          done < <(jq -r '.[] | [.stateID, .exportedFileName] | @tsv' \
            "$shard_evidence_path/candidate-exports.json")
          jq -Rn '[inputs | split("\t") | {
              stateID: .[0], artifactPath: .[1], sha256: .[2], bytes: (.[3] | tonumber)
            }]' < "$RUNNER_TEMP/s10-4-segment-candidate-files.tsv" \
            > "$shard_evidence_path/candidate-files.json"

          sed -n 's/^S10_4_AX_STATE //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$shard_evidence_path/state-ax.ndjson"
          jq -s '.' "$shard_evidence_path/state-ax.ndjson" \
            > "$shard_evidence_path/state-ax.json"
          jq -c '[.[].stateID]' "$shard_evidence_path/state-ax.json" \
            > "$RUNNER_TEMP/s10-4-segment-ax-state-ids.json"
          cmp -s "$expected_owned_path" "$RUNNER_TEMP/s10-4-segment-ax-state-ids.json"
          jq -e --arg shard "$CI_S10_4_SHARD_ID" --arg requirement "$CI_S10_4_REQUIREMENT_ID" \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" '
              all(.[];
                .shardID == $shard and .requirementID == $requirement
                and .deviceProfileID == $profile and .result == "PASS"
                and (.evidenceID == ("s10.4-ax-" + $shard + "-" + .stateID))
                and .capture == "XCUIApplication.debugDescription"
                and (.axTreeSHA256 | test("^[0-9A-F]{64}$")))
            ' "$shard_evidence_path/state-ax.json" > /dev/null
          while IFS= read -r row; do
            state_id="$(jq -r '.stateID' <<< "$row")"
            jq -cS --arg productHead "$GITHUB_SHA" '. + {sourceProductHead: $productHead}' \
              <<< "$row" > "$state_ax_path/$state_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/state-ax.json")

          sed -n 's/^S10_4_CONTRAST //p' "$CI_ARTIFACT_DIR/ui-smoke.log" \
            > "$shard_evidence_path/contrast.ndjson"
          jq -s '.' "$shard_evidence_path/contrast.ndjson" \
            > "$shard_evidence_path/contrast.json"
          jq -c '[.[].stateID]' "$shard_evidence_path/contrast.json" \
            > "$RUNNER_TEMP/s10-4-segment-contrast-state-ids.json"
          cmp -s "$expected_owned_path" \
            "$RUNNER_TEMP/s10-4-segment-contrast-state-ids.json"
          jq -e --arg shard "$CI_S10_4_SHARD_ID" --arg requirement "$CI_S10_4_REQUIREMENT_ID" \
            --arg profile "$CI_S10_4_DEVICE_PROFILE_ID" '
              all(.[];
                .shardID == $shard and .requirementID == $requirement
                and .deviceProfileID == $profile
                and (.result == "PASS" or .result == "EXCEPTION")
                and (.evidenceID == ("s10.4-contrast-" + $shard + "-" + .stateID))
                and (.axTreeSHA256 | test("^[0-9A-F]{64}$"))
                and (.ignoredAuditIssues | type == "array"))
            ' "$shard_evidence_path/contrast.json" > /dev/null
          today="$(date -u +%F)"
          jq -e --arg today "$today" --slurpfile plan Scripts/s10-4-segment-plan.json '
            all(.[];
              . as $row
              | ([$plan[0].exceptionAuthorities[]
                    | select(.stateID == $row.stateID)
                    | .exceptionIssueID] | sort) as $expectedIssueIDs
              | if ($expectedIssueIDs | length) == 0 then
                  $row.result == "PASS"
                  and $row.exceptionIssueID == ""
                  and $row.exceptionOwner == ""
                  and $row.exceptionExpiresAt == ""
                  and $row.exceptionRationale == ""
                  and $row.ignoredAuditIssues == []
                else
                  $row.result == "EXCEPTION"
                  and (($row.exceptionIssueID | split(" | ") | sort) == $expectedIssueIDs)
                  and $row.exceptionOwner == "palatis3"
                  and $row.exceptionExpiresAt == "2026-11-20"
                  and $today <= $row.exceptionExpiresAt
                  and ($row.exceptionRationale | type == "string" and length > 0)
                  and (($row.ignoredAuditIssues | length) == ($expectedIssueIDs | length))
                  and all($row.ignoredAuditIssues[];
                    (keys | sort) == ([
                      "applicationFrame", "auditTypeRawValue", "compactDescription",
                      "detailedDescription", "elementFrame", "elementIdentifier",
                      "elementLabel", "elementType"
                    ] | sort)
                    and .auditTypeRawValue == "1"
                    and .compactDescription == "Contrast failed"
                    and .detailedDescription == "Contrast failed for SwiftUI.AccessibilityNode"
                    and (.elementIdentifier | type == "string")
                    and (.elementLabel | type == "string")
                    and (.elementType | type == "string")
                    and (.elementFrame | type == "object")
                    and (.applicationFrame | type == "object"))
                end)
          ' "$shard_evidence_path/contrast.json" > /dev/null
          while IFS= read -r row; do
            state_id="$(jq -r '.stateID' <<< "$row")"
            jq -cS --arg productHead "$GITHUB_SHA" '. + {sourceProductHead: $productHead}' \
              <<< "$row" > "$state_contrast_path/$state_id.json"
          done < <(jq -c '.[]' "$shard_evidence_path/contrast.json")

          directory_digest() {
            local source_dir="$1"
            local digest_rows="$RUNNER_TEMP/segment-directory-digest-$(basename "$source_dir").txt"
            : > "$digest_rows"
            while IFS= read -r file_path; do
              printf '%s  %s\n' "$(shasum -a 256 "$file_path" | awk '{print toupper($1)}')" \
                "${file_path#"$source_dir/"}" >> "$digest_rows"
            done < <(find "$source_dir" -type f | LC_ALL=C sort)
            shasum -a 256 "$digest_rows" | awk '{print toupper($1)}'
          }
          xcrun xcresulttool get test-results tests --path "$CI_ARTIFACT_DIR/UnitTests.xcresult" \
            --compact > "$RUNNER_TEMP/s10-4-segment-unit-tests.json"
          xcrun xcresulttool get test-results tests --path "$CI_ARTIFACT_DIR/UISmoke.xcresult" \
            --compact > "$RUNNER_TEMP/s10-4-segment-ui-tests.json"
          build_identity="$(directory_digest "$CI_ARTIFACT_DIR/Build.xcresult")"
          unit_identity="$(directory_digest "$CI_ARTIFACT_DIR/UnitTests.xcresult")"
          ui_identity="$(directory_digest "$CI_ARTIFACT_DIR/UISmoke.xcresult")"
          unit_executed_test_selectors="$(jq -c '
            [.. | objects
              | select(.nodeType? == "Test Case" and .result? == "Passed")
              | .nodeIdentifier]
            | unique | sort
          ' "$RUNNER_TEMP/s10-4-segment-unit-tests.json")"
          ui_executed_test_selectors="$(jq -c '
            [.. | objects
              | select(.nodeType? == "Test Case" and .result? == "Passed")
              | .nodeIdentifier]
            | unique | sort
          ' "$RUNNER_TEMP/s10-4-segment-ui-tests.json")"
          unit_executed_test_count="$(jq 'length' <<< "$unit_executed_test_selectors")"
          ui_executed_test_count="$(jq 'length' <<< "$ui_executed_test_selectors")"
          test "$unit_executed_test_count" -eq 5
          test "$ui_executed_test_count" -eq 1
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          sdk_build="$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
          sdk_name="iphonesimulator$sdk_version"
          test "$sdk_name" = "iphonesimulator26.5"
          test "$sdk_build" = "23F81a"
          attachment_count="$(jq '[.[]?.attachments[]?] | length' "$attachment_manifest_path")"
          session_identity="$(printf '%s\n%s\n%s\n%s\n' "$RUNNER_NAME" "$CI_SIMULATOR_UDID" \
            "$GITHUB_JOB" "$ui_identity" | shasum -a 256 | awk '{print toupper($1)}')"
          selector_sha256="$(shasum -a 256 Scripts/ci-selection.json | awk '{print toupper($1)}')"
          shard_contract_sha256="$(shasum -a 256 Scripts/s10-4-shards.json | awk '{print toupper($1)}')"
          inventory_sha256="$(shasum -a 256 docs/design/s10/s10-screen-state-inventory.json | awk '{print toupper($1)}')"
          common_task_schema_sha256="$(shasum -a 256 docs/design/s10/s10-accessibility-common-tasks.json | awk '{print toupper($1)}')"
          evidence_kernel_json="$(jq -cS '
            {
              productHead,
              selectorSHA256,
              shardContractSHA256,
              inventorySHA256,
              commonTaskSchemaSHA256,
              orderedStateSHA256,
              stateSetSHA256,
              captureBaselineSHA256,
              state27CallerSHA256,
              preflightHelperSHA256,
              issueRecheckHelperSHA256,
              exceptionAuthorities
            }
          ' Scripts/s10-4-segment-plan.json)"
          evidence_kernel_sha256="$(printf '%s' "$evidence_kernel_json" \
            | shasum -a 256 | awk '{print toupper($1)}')"
          test "$evidence_kernel_sha256" = \
            "$(jq -r '.evidenceKernelSHA256' Scripts/s10-4-segment-plan.json)"
          plan_sha256="$(shasum -a 256 Scripts/s10-4-segment-plan.json | awk '{print toupper($1)}')"
          xcode_build="${EXPECTED_XCODE_BUILD#Build version }"
          jq -n \
            --arg taskID "$CI_TASK_ID" \
            --arg shardID "$CI_S10_4_SHARD_ID" \
            --arg requirementID "$CI_S10_4_REQUIREMENT_ID" \
            --arg deviceProfileID "$CI_S10_4_DEVICE_PROFILE_ID" \
            --arg productHead "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runID "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg jobID "$GITHUB_JOB" \
            --arg artifactName "ios-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_S10_4_SHARD_ID-$CI_S10_4_SEGMENT_ID" \
            --arg runnerProvider "$CI_RUNNER_PROVIDER" \
            --arg runnerLabel "$CI_RUNNER_LABEL" \
            --arg runnerName "$RUNNER_NAME" \
            --arg xcodeVersion "$EXPECTED_XCODE_VERSION" \
            --arg xcodeBuild "$xcode_build" \
            --arg sdkName "$sdk_name" \
            --arg sdkBuild "$sdk_build" \
