# AssetRounds inherits the owner's selected Codex GUI/session permission profile.
# D-004 explicitly permits Full access, network access, and no approval prompts.
# CURRENT_TASK.md still limits product scope, paths, branches, and external actions.

# Owner-selected project defaults (2026-09-19). Explicit session choices still win.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Owner-approved helper routing (2026-09-29); see AGENTS.md.
# Every helper uses GPT-6.1 Sol, including support and independent review.
# Extra-high reasoning for every helper, per latest owner decision 28.
# Reuse retained handoffs; root alone integrates, commits, pushes and dispatches.
# Exposed session capacity remains the hard limit.
[agents]
max_concurrent_threads_per_session = 10
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "xhigh"

[features]
goals = true

[plugins."github@openai-curated"]
enabled = true
