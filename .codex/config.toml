# AssetRounds inherits the owner's selected Codex GUI/session permission profile.
# D-004 explicitly permits Full access, network access, and no approval prompts.
# CURRENT_TASK.md still limits product scope, paths, branches, and external actions.

# Owner-selected project defaults (2026-09-19). Explicit session choices still win.
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

# Root implements; one bounded helper. Select model and effort explicitly
# when spawning, following AGENTS.md (medium for consequential reviews).
# Installed CLI 0.144.5 rejects the newer default_subagent_* settings.
[agents]
max_threads = 2

[features]
goals = true

[plugins."github@openai-curated"]
enabled = true
