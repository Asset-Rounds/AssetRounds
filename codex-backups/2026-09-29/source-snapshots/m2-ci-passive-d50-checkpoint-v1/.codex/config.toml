# AssetRounds inherits the owner's selected Codex GUI/session permission profile.
# D-004 explicitly permits Full access, network access, and no approval prompts.
# CURRENT_TASK.md still limits product scope, paths, branches, and external actions.

# Owner-selected project defaults (2026-09-19). Explicit session choices still win.
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

# Owner-approved helper routing (2026-09-26); see AGENTS.md.
# Root stays hands-on. Seven helpers are a ceiling, not a quota; root is excluded.
# Reuse relevant helper context before spawning another agent.
# Astra medium is the bounded-coding default; explicitly choose low for simple
# mechanical coding and high for difficult or safety-critical work and reviews.
# Explicitly select gpt-6-sol with medium/high effort for bounded non-coding
# support. Required independent consequential reviews remain nonauthor Astra.
# Each assignment specifies scope, owned paths, deliverable and verification.
# Existing sessions retain their actual exposed tool capacity and model settings.
# Validated with installed CLI 0.158.0-alpha.2.1.
[agents]
max_concurrent_threads_per_session = 7
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "medium"

[features]
goals = true

[plugins."github@openai-curated"]
enabled = true
